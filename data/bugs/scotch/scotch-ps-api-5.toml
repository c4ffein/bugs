[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Reject duplicates in graphCheck (recommended)"
summary = "When vlbltax != NULL, sort a copy of the labels and reject equal neighbours."
diff_file = "patches/G14-graph-loaders/0007-Bugfix-reject-duplicate-vertex-labels-in-graphCheck-.patch"
tested = "Built 32/64-bit (0 warnings); tl 1 rejected, tl 0 accepted; check_scotch_graph_map/order/induce/coarsen and check_prog_gtst/gbase/gmk/gout/gpart (all on labelled graphs) still pass."
tradeoffs = "Adds an O(V log V) sort and a memAlloc to a Check routine that was allocation-free, so the check can now fail with out-of-memory. Internal graphs never carry duplicate labels, so no legitimate graph is rejected."
preferred = true
maintainer_fit = "Section 3.3 of the maintainer guide: a Check method verifies internal consistency; label uniqueness is such an invariant, enforced everywhere else at construction. DECISION FOR MAINTAINER: whether allocation inside graphCheck is acceptable; alt-B avoids it."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Leave graphCheck; harden consumers"
summary = "Keep Check allocation-free and make label consumers robust (e.g. graphTabLoad / API-21)."
diff_file = "alt/G14-graph-loaders/PS-API-5-b-harden-consumers.diff"
tested = "untested: alternative not built."
tradeoffs = "No allocation in Check, but whack-a-mole across every label consumer and never surfaces the invalid graph to the user."
preferred = false
maintainer_fit = "He may prefer this if he wants graphCheck to stay allocation-free; otherwise the invariant check is cleaner."

