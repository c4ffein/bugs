[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Post-pass in wgraphPartRb: assign to the lightest part every separator vertex with no neighbour in a part (recommended)"
summary = "New static wgraphPartRbFron() called after wgraphCost(): removes such vertices from the frontier, assigns them to the lightest part, updates compload/compsize/fronload incrementally (neighbouring separator vertices now separate that part too)."
diff_file = "patches/G12-overlap-kgraph-rb/0008-Bugfix-assign-to-a-part-the-separator-vertices-that-.patch"
tested = "repro above; check_scotch_graph_part_ovl, check_prog_gpart_overlap on 32-bit, 64-bit and SCOTCH_DEBUG_ALL builds (wgraphCheck validates the updated loads)."
tradeoffs = "Changes outputs only when lost vertices exist; O(sum of degrees of lost vertices and their neighbours). Choice of the lightest part ignores locality (a lost vertex may be far from its part); a 2-hop neighbourhood choice would be a refinement."
preferred = true
maintainer_fit = "Local to the RB method that produces the situation, guarantees the documented model for every vertex, does not touch the vgraph separators used by orderings. Same 'fix-up after recursion' idea as kgraphMapRbVfloMerge()."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Post-pass on zero-degree vertices only (first pass)"
summary = "Move isolated frontier vertices to the lightest part."
diff_file = "alt/G12-overlap-kgraph-rb/SEP-17-a-degree-zero-post-pass.diff"
tested = "read and compared: misses subgraph-isolated vertices (path 4 4 keeps lost=2 on the recommended fix's test matrix reasoning: vertex 0 has degree 1)."
tradeoffs = "Incomplete."
preferred = false
maintainer_fit = "Does not meet the model."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Fix at the source in vgraphSeparateGg: do not leave an isolated root in the separator"
summary = "When growth stops for balance reasons and the current root has no neighbour, put it back in part 0."
diff_file = "alt/G12-overlap-kgraph-rb/SEP-17-b-vgraph-gg-isolated-root.diff"
tested = "untested: only one of several separator methods (FM, DF, BD, ML...), does not cover cross-level losses; changes ordering results."
tradeoffs = "Larger blast radius (nested dissection), partial."
preferred = false
maintainer_fit = "Unlikely in a bugfix release."

