[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Barrier after the offspring loop + pre-spawned local random contexts (recommended)"
summary = "threadBarrier after the offspring loop; each worker thread uses an IntRandContext spawned by the launcher with intRandSpawn() before contextThreadLaunch(), thread 0 keeps the context generator (exactly G08's bgraphBipartGg() idiom, patches 0002/0003 of G08); the thread block keeps only randdat since its other fields were never used."
diff_file = "patches/G09-bgraph-df-ga-fm/0006-Bugfix-synchronize-threads-and-use-local-pseudo-rand.patch"
tested = "TSan 0 reports (3 runs), results reproducible run to run; check_scotch_graph_map, check_prog_gpart, check_prog_gmap, check_scotch_graph_order, check_scotch_context, check_scotch_graph_part_ovl, check_prog_gpart_overlap, check_prog_gpart_remap, check_scotch_graph_coarsen all pass with 0 sanitizer reports on the 32-bit and the 64-bit ASan+UBSan builds of the full series (logs $WORK/check_build*_*.log); check_prog_gpart, check_prog_gmap, check_scotch_context and check_scotch_graph_map also pass on a -DSCOTCH_DEBUG_ALL build"
tradeoffs = "GA results change (different random streams per thread) but were timing-dependent before. One more barrier per generation. BgraphBipartGaThread loses 8 unused Gnum fields and gains one IntRandContext."
preferred = true
maintainer_fit = "Mirrors his bgraph_bipart_gg.c (contdat/contptr, intRandSpawn, thread 0 on the caller's context) and graph_match.c; the dead fields were copy-pasted from bgraph_bipart_df.h."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Thread 0 draws every random value in its sequential sections"
summary = "Keep the single generator: the launcher draws the whole initial population into a shared array, thread 0 draws crossing-over and mutation points for the generation while it builds the mating permutation; workers only read; plus the same barrier."
diff_file = "alt/G09-bgraph-df-ga-fm/SEP-12-b-thread0-draws-all-random-values.diff"
tested = "untested: compiled only."
tradeoffs = "Thread-timing independent and partly thread-count independent, but serialises all random draws (O(pop * vertnbr) bits), needs three shared arrays and copies the initial population twice."
preferred = false
maintainer_fit = "Against his memory-affinity design (private demes allocated by each thread) and his spawn idiom; unlikely."

