[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Store labels verbatim; edge ends of labeled meshes are labels (graphLoad semantics)"
summary = "Drop the `+ vertbas + baseadj`; set edgeadjtab to 0 for labeled meshes; graphLoad2 enforces label uniqueness across both kinds. Add the mcv round trip of small2_lbl.msh and the labeled geometry test."
diff_file = "patches/G11-mesh-struct-io/0011-Bugfix-keep-vertex-labels-of-mesh-files-unchanged-in.patch"
tested = "check_prog_mcv/mord/gmk_msh, check_scotch_mesh_geom, mtst 32/64-bit; fuzz after-run."
tradeoffs = "Behaviour change for base-0 labeled files whose element and node labels overlap: they now fail with 'duplicate vertex label' (they loaded before but produced shifted labels on every output). Design decision for the maintainer: this commit is last in the series so it can be dropped without conflicts."
preferred = true
maintainer_fit = "Matches graphLoad/graphSave (his files) and the doc; keeps mcv idempotent, which check_prog_mcv already requires for unlabeled meshes."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Keep the shifted in-memory labels and make meshSave undo the shift"
