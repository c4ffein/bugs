diff_file = "alt/G11-mesh-struct-io/PS2-5-b-symmetric-save.diff"
tested = "syntax-checked only"
tradeoffs = "Round trip restored, but labels in orderings and geometry files stay shifted and overlapping labels across kinds stay ambiguous."
preferred = false
maintainer_fit = "Preserves an undocumented encoding; he prefers one convention shared with graphs."

