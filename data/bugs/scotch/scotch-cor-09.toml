[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A. Complete the start-up barrier with the reduced count, then exit (recommended)"
summary = "Under the lock set thrdnbr = thrdnum (threads launched so far + main); main joins threadContextBarrier() so the launched slaves reach their wait loop; threadContextExit() terminates them; destroy lock/cond when no slave was launched (thrdnbr == 1 makes Exit2 return at once); memFree (desctab)."
diff_file = "patches/G06-threads-context/0002-Bugfix-release-launched-threads-when-thread-creation.patch"
tested = "repro/COR-09 FAIL_AT=1,2,3 on 32- and 64-bit ASan trees (no hang, no leak); TSan tree 0 warnings; check_common_thread, check_common_random, check_scotch_context, check_scotch_graph_map at 1/2/4 threads x SCOTCH_DETERMINISTIC=0/1 on both trees, all rc=0."
tradeoffs = "Keeps the maintainer's protocol and his own intent (he already lowered thrdnbr and called threadContextExit). One special case (thrdnum == 1) because the lock features are only destroyed by Exit2 when thrdnbr > 1. The slaves' unlocked early-out read of thrdnbr in threadContextBarrier():231 can only observe 1 when no slave exists, so it is harmless (TSan agrees)."
preferred = true
maintainer_fit = "Minimal change in the shape of the existing failure path, reusing threadContextBarrier()/threadContextExit() exactly as the success path does ('Ensure all slave threads have started before cleaning-up resources', common_thread.c:154). Same style as his 7.0.17 fixes that complete an error path rather than redesign it (3c9b3ab 'Rework error handling and structure of dgraphInduce()')."

