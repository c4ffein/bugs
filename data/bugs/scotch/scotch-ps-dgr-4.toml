[[imported."pyscotch-7.0.17-new".fix_options]]
label = "A: always perform the agreements (fold: commit 0003; gather: 0004; redist: 0006) (recommended)"
summary = "Remove the #ifdef/#else around the MPI_Allreduce of the local error flag wherever a following collective or point-to-point exchange would otherwise be entered by the other processes; in dgraphRedist2() the second allocation phase is restructured in the goto idiom so that the agreement can also free the arrays not yet attached to the graph."
diff_file = "patches/G18-dgraph-fold-redist/0006-Bugfix-make-error-handling-of-dgraphRedist-collectiv.patch"
tested = "Fault injection on fold, gather, redist, ordering (hdgraphFold2/hdgraphGather): every allocation failure returns 1 on all ranks. After the series: check_strat_par, check_scotch_dgraph_{check,band,coarsen,order,grow,induce,redist}, check_libparmetis_{v3,dual}, check_prog_{dgord,dgpart,dgscat-dggath,dgtst} all exit 0 on the 32-bit ASan+UBSan tree and on the 64-bit Gnum tree ($WORK/chk_32_*.log, chk_64_*.log; the only sanitizer lines are pre-existing ones in library_dgraph_coarsen.c:163 and bgraph_bipart_ml.c:195, other groups); check_scotch_dgraph_{check,coarsen,order,redist,induce} and check_prog_dgord also pass on an ASan -DSCOTCH_DEBUG_ALL tree (chk_dbg_*.log). Zero compiler warnings in the three trees. git am of the 7 patches on a fresh clone of v7.0.17 succeeds."
tradeoffs = "One 1-int MPI_Allreduce per agreement in release builds (fold: 2, gather: 1, redist: 3). All these routines move O(graph) data, so the cost is in the noise; but it reverses an explicit decision of the maintainer ('cannot be merged with a useful one')."
preferred = true
maintainer_fit = "His 7.0.17 reworks (hdgraphGather 0635547) keep an unconditional MPI_Allreduce at the fail label; for dgraphInduce2 (3c9b3ab) he piggybacked on an existing Allgather instead, which is possible only when one exists at the right place."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "B: piggyback the error on an existing collective with a fallback allocation (dgraphInduce2 idiom), where one exists"
summary = "dgraphRedist(): on allocation failure, allocate a smaller array for synchronisation, send negative counts in the existing MPI_Allreduce of per-part counts; everyone detects a negative sum. Not applicable to dgraphRedist2's two agreements, the fold's agreements or the gather (no suitable collective)."
diff_file = "alt/G18-dgraph-fold-redist/PS-DGR-4-B-piggyback-on-count-allreduce.diff"
tested = "compiles against pristine headers (1 warning: 'vertlocnum' may be used uninitialised is a false positive of the restructured else); not run"
tradeoffs = "Saves one Allreduce in one of the six places; more code (fallback allocation path) and a 'cannot do a clean exit' return when even the fallback fails."
preferred = false
maintainer_fit = "It is his own 3c9b3ab idiom; he may prefer it for dgraphRedist(). Offered as the alternative for commit 0006."

