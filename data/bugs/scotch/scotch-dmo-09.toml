[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "219040c8bc"
verdict = "correct"
details = '''
Sets the ratio wherever the partition changes without a method of its own (bdgraphZero :193, bdgraphBipartSq :243, bdgraphBipartMlUncoarsen :753 recomputed instead of copied from the local coarse graph), and gives the gathered Bgraph the distributed value (`gather_all.c:255`; the early bgraphZero path at :197-201 sets its own).

The coarse graph's field is still never written by bdgraphBipartMlCoarsen, but every coarse graph goes through bdgraphZero (Uncoarsen with NULL, `ml.c:297-310`) or the recomputation (:753) before any strategy reads it, so no uninitialized read remains (probes with fold=d and default sizes clean). The new lines divide by compglbload0avg without the zero guard of bdgraphInit2 (`bdgraph.c:138`), like the five pre-existing method sites (df :389, ex :493, bd :444, store :174): consistent, only a double inf/NaN if a domain weight were 0. The band copy `bdgraph_bipart_bd.c:202` is left, correctly (anchor loads tilt the band graph's own ratio).

**Cosmetic**

df/ex/store keep the explicit ternary while the new lines use ABS.'''
compared_with_ours = "Same four sites as our 0004. Ours computed a signed, zero-guarded ratio in bdgraphZero (a leftover of bdgraphInit2's form) and recomputed the gathered value from the centralized loads; upstream's copies the already-correct distributed value and uses ABS everywhere, which is simpler and uniform. Upstream's is better; our 0004 is dropped."

