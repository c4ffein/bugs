[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "b72baf2017"
verdict = "incomplete"
details = '''
Right idea and right arithmetic for valid input: kbalval = ubvec\[0\] - 1.0 in both v5 wrappers (`metis_graph_part.c:553`, 589), so 1.05 → 0.05 and 1.001 → 0.001 (cli03: imbalance 1.0001-1.0200 instead of 2.0079). Missing:

1. no validation: ubvec\[0\] <= 1.0 gives a zero or negative tolerance, silently accepted (cli03e: ubvec=0.05 → kbalval -0.95 and ubvec=-0.5 → -1.5 both return METIS_OK; with a negative tolerance `kgraph_map_rb.c:140-141` sets comploadmin above comploadmax), whereas MeTiS requires ratios greater than one
2. the in-tree test still passes the old Scotch-style value, `test_libmetis.c:176` `kbaltab[1] = { 0.05 }`, so check_libmetis_v5 now runs with kbalval = -0.95 and still passes, i.e. the test no longer tests a meaningful tolerance
3. the ParMETIS twin is untouched: `parmetis_dgraph_part.c:133` `ubvec, /* Not used */` and the default 0.05 strategy (:178)
4. ncon > 1 still reads vwgt unstrided (CLI-07)
5. cosmetic: `1.0L` long double literals and `0.01` vs `0.01L` between the twins. 32/64-bit identical. v3 twins (459, 490, 521) keep 0.01 and have no ubvec: nothing to convert.'''
compared_with_ours = "Our 7.0.17 0003 did the same conversion in one shared \\_SCOTCH_METIS_V5_PartGraph() routine, rejected ubvec\\[0\\] <= 1.0 and ncon < 1 with METIS_ERROR_INPUT, gathered the first constraint for ncon > 1, honoured ubvec\\[0\\] and the tpwgts stride in ParMETIS_V3_PartKway, and changed the tests to MeTiS ratios (1.05). Upstream's is the smaller diff; ours is complete. Rebased 0003 keeps our structure (0004/0005 build on it) and its message now describes only what upstream's commit leaves."

