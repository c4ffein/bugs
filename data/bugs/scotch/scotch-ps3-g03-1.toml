[imported."pyscotch-7.0.18-new".upstream_fix_review]
commit = "3df345a8de"
verdict = "incomplete"
details = '''
**Right**

archMeshXArchLoad() now rejects dimnnbr < 1 (`arch_mesh.c:651`), which fixes the meshXD half of COR-07 (`meshXD 0`, `meshXD -1`, `torusXD 0` → `archMeshXArchLoad: bad input (1)`, verified); SCOTCH_archMesh2/3/X() now reject non-positive sizes and dimension counts; every loader/builder has a size check.

**Wrong**

the check `(archsiz * c) < archsiz` (`arch_mesh.c:127,408-409,667`; `library_arch.c:399,444-445,494,643,681-682,723`) computes the overflowing signed product (UBSan) and misses wraps to a larger value: `mesh2D 100000 50000` → `arch_mesh.c:127:41: runtime error: signed integer overflow` then accepted, and atst tries to allocate 0x690edd000 bytes; SCOTCH_archMesh2/Torus2 (100000, 50000) accepted with UBSan at `library_arch.c:399`/674.

Missing: SCOTCH_archTorus2/3/X() do not reject non-positive sizes (torusapi `t2 0 5` → ret=0 size=0) and SCOTCH_archTorusX() accepts dimnnbr <= 0 (`tx 0 4` → ret=0), SCOTCH_archMeshX() never checks c\[0\] (`mx 2 0 4` → ret=0 size=0); the cmpltw/cmpltws weight sums (`arch_cmpltw.c:188`, 259) are still unchecked (`cmpltw 2 2000000000 2000000000` → `signed integer overflow: 2000000000 + 2000000000`).'''
compared_with_ours = "Our 7.0.17 0002 used the ANUMMAX division idiom in the three loaders and covered cmpltw sums; it did not touch the API builders (upstream's commit adds those, which is better). Rebased 0001 keeps upstream's loader/builder checks, replaces the product comparisons by the division idiom, and adds the missing torus/meshX parameter checks and the cmpltw sums."

