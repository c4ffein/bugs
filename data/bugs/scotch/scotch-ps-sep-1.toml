[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Give MESHVERTGROUP its own bit (0x0020)"
summary = "mesh.h: MESHVERTGROUP = 0x0020 like GRAPHVERTGROUP; fix the MESHFREEVEND comment; add data/small2_lbl.msh loaded by mtst in check_prog_mcv."
diff_file = "patches/G11-mesh-struct-io/0001-Bugfix-give-MESHVERTGROUP-its-own-flag-bit-report-Py.patch"
tested = "32/64-bit builds, 0 warnings; mtst on m16_lbl.msh and small2_lbl.msh clean under ASan; check_prog_mmk/mcv/mord/gmk_msh, check_scotch_mesh_graph, check_mesh_base pass in both builds."
tradeoffs = "Flag values are internal (mesh.h is not installed); no ABI change. Meshes with MESHFREETABS alone no longer 'have' VERTGROUP, which only matters for hmeshExit (no such Hmesh exists)."
preferred = true
maintainer_fit = "This is what graph.h does (GRAPHFREEOTHR 0x0008, GRAPHVERTGROUP 0x0010, graph.h:84-86); one-line, same family as his 'assign proper variable' fixes."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Test MESHVERTGROUP before freeing vlbltab in meshFree"
summary = "mesh.c: `if ((vlbltax != NULL) && ((flagval & MESHVERTGROUP) == 0))` like graphFree does for velotax/vlbltax."
diff_file = "alt/G11-mesh-struct-io/PS-SEP-1-b-meshfree-guard.diff"
tested = "syntax-checked only (gcc -fsyntax-only with build CFLAGS)"
tradeoffs = "Leaves the two flags aliased: a mesh that wants both 'grouped' and 'free others' is impossible, MESHFREETABS keeps implying VERTGROUP for hmeshExit, and the debug vnumtab check stays silenced."
preferred = false
maintainer_fit = "He would not keep two flags on one bit once seen; graphFree has the same guard only because the bits are distinct."

