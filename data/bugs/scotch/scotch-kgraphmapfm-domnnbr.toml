[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Refresh domnnbr after the fallback (recommended)"
summary = "Make domnnbr a mutable local, re-read grafptr->m.domnnbr after the fallback kgraphMapSt, reallocate+refill the imbalance arrays with it; check and stratExit the fallback strategy; free on error paths."
diff_file = "patches/G13-kgraph-fm-df-bd/0006-Bugfix-refresh-the-domain-count-after-the-fallback-i.patch"
tested = "Built 32- and 64-bit, 0 warnings; both reproducers clean under ASan/UBSan; clean under SCOTCH_DEBUG_ALL; check_scotch_graph_map/order/mesh_graph, check_prog_gmap/gpart pass."
tradeoffs = "Runs FM refinement on the new k-way mapping (intended). If the kgraph is a band graph the changed count is then caught by kgraphMapBd (GRA-20 fix). No ABI change."
preferred = true
maintainer_fit = "Completes the intent stated by the existing :1047 comment; matches the surrounding 'read field, realloc, refill' idiom (cf. kgraphMapRb comploadavg realloc, kgraph_map_rb.c:169)."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Skip refinement when the fallback changed the part count"
summary = "After the fallback, if grafptr->m.domnnbr != saved count (or fronnbr==0), free and return 0 (the fallback mapping is already valid)."
diff_file = "alt/G13-kgraph-fm-df-bd/GRA-02-B-skip-refine-on-changed-count.diff"
tested = "Compiles; avoids the overflow by not entering the FM pass when the count changed."
tradeoffs = "Loses FM refinement exactly when the fallback created parts (quality, not correctness). Minimal and obviously safe."
preferred = false
maintainer_fit = "He may prefer the refresh since the fallback was clearly meant to feed FM; this is the conservative fallback if refresh is judged risky."

