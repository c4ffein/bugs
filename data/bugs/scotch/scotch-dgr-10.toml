tested = "Fault injection on both routines (above). After the series: check_strat_par, check_scotch_dgraph_{check,band,coarsen,order,grow,induce,redist}, check_libparmetis_{v3,dual}, check_prog_{dgord,dgpart,dgscat-dggath,dgtst} all exit 0 on the 32-bit ASan+UBSan tree and on the 64-bit Gnum tree ($WORK/chk_32_*.log, chk_64_*.log; the only sanitizer lines are pre-existing ones in library_dgraph_coarsen.c:163 and bgraph_bipart_ml.c:195, other groups); check_scotch_dgraph_{check,coarsen,order,redist,induce} and check_prog_dgord also pass on an ASan -DSCOTCH_DEBUG_ALL tree (chk_dbg_*.log). Zero compiler warnings in the three trees. git am of the 7 patches on a fresh clone of v7.0.17 succeeds."
tradeoffs = "One 1-int MPI_Allreduce per gather in release builds (a gather moves the whole graph). Function shape changes (goto labels instead of nested else-ifs)."
preferred = true
maintainer_fit = "Mirrors his own rework of the twin (0635547) line for line: 'cheklocval = 1; /* Assume an error */', 'goto fail;', 'cheklocval = 0; /* Everything went well */ fail: if (MPI_Allreduce (...'."

