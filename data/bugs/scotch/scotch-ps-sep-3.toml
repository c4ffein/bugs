[[imported."pyscotch-7.0.17-new".fix_options]]
label = "a: per-table dummy link embedded in GainTabl (linkdat)"
summary = "GainTabl gets 'GainLink linkdat; /*+ Dummy link for fast list operations +*/'; gain.c compares against &tablptr->linkdat; the static is deleted; the debug checkers take the table pointer."
diff_file = "patches/G08-bgraph-gg-gain/0004-Bugfix-use-per-table-dummy-gain-link-to-avoid-concur.patch"
tested = "32/64-bit builds 0 warnings; gain.c also compiled with -DSCOTCH_DEBUG_GAIN1/2/3; full -DSCOTCH_DEBUG_ALL -DSCOTCH_DEBUG_GAIN3 build runs gpart and three check targets; TSan clean for gain.c; six check targets pass on both widths."
tradeoffs = "+24 bytes per table; the branch-free TRICK is kept; writes now land in the owning table's memory; no behaviour change."
preferred = true
maintainer_fit = "His own idiom: fibo.h:104 'FiboNode rootdat; /*+ Dummy node for fast root insertion +*/' with '!= &treeptr->rootdat' comparisons in fibo.c; keeps the gain.h macro untouched and the sentinel private."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "b: conditional writes, sentinel exported for the gain.h macro"
summary = "Guard the three writes with 'if (x->next != &gainLinkDummy)'; the macro in gain.h needs the sentinel, so it becomes a non-static exported symbol (module.h rename) and the macro a do/while."
diff_file = "alt/G08-bgraph-gg-gain/PS-SEP-3-b-conditional-write.diff"
tested = "compile-checked only (gain.c and bgraph_bipart_gg.c with the modified gain.h, 0 diagnostics); not run."
tradeoffs = "Adds a branch on the hottest path of every FM/GG (the TRICK exists to avoid it), exports a new internal symbol, changes a statement-expression macro into a do/while that no longer composes in expressions."
preferred = false
maintainer_fit = "Defeats the explicit 'TRICK' design comment; he would not add a branch there."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "c: thread-local sentinel"
summary = "static _Thread_local GainLink gainLinkDummy;"
diff_file = "alt/G08-bgraph-gg-gain/PS-SEP-3-c-thread-local.diff"
tested = "compile-checked only (0 diagnostics); not run."
tradeoffs = "Two lines, but pointer identity differs per thread: a table initialized by one thread (entries = &dummy_A) and used by another compares against &dummy_B and sees every slot as non-empty; needs C11 or compiler extensions (_Thread_local / __declspec(thread)), which the tree does not use anywhere."
preferred = false
maintainer_fit = "Introduces a portability dependency and a latent semantic trap for a 24-byte saving."

