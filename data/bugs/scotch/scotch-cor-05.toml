[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "d4b6f9976c"
verdict = "incomplete"
details = '''
**Right**

well-formed `dist` files now load, save and reload (dist_ok, dist_sub, dist_subsub: ret=0, no report), the inner Arch is allocated, the new archDistArchFree() is registered and renamed in `module.h`, and matching routines make `dist` usable inside `sub` (`sub 2 0 1 dist 2 cmplt 4` loads and round-trips). This settles the 7.0.17 design question: upstream keeps `dist` as a loadable class and owns the inner Arch (our option A).

**Incomplete**

1. archDistArchFree() (`arch_dist.c:161-164`) does not check archptr->archptr, which is set only on success (`arch_dist.c:111`), so every malformed `dist` file crashes in the clean-up that archLoad() performs: `dist abc` and `dist 2 cmplt abc` → `arch.c:173:15: runtime error: member access within null pointer of type struct Arch ... #1 _SCOTCHarchDistArchFree arch_dist.c:162` then SEGV
    - a plain-build malloc-failure sweep crashes dist_ok.tgt at #3 and dist_sub/dist_subsub at every failure from #3 on
2. the inner Arch (`arch_dist.c:101`) is not archInit()ed, so a nested `dist`/`sub` whose loading fails frees garbage (`dist 2 dist 3 cmplt abc`, `dist 2 sub 3 0` → 0xbebebebe)
3. a loaded `dist` does not inherit ARCHVAR/ARCHPART from its inner architecture, which archDistArchBuild() does (`arch_dist.c:186`): `dist 2 varcmplt` reports var=0 size=1 and gmap maps all 16 vertices of m4x4 onto one domain, while `varcmplt` alone spreads them
4. crloval < 1 is accepted (`dist 0 cmplt 4` loads; kgraphInit() rejects it only under SCOTCH_DEBUG_KGRAPH2, `kgraph.c:98-103`)
5. archDistArchBuild() still copies ARCHFREE from the original architecture, which it does not own: latent double free (no caller). Companion test: 0d878bdd adds `gmap bump.grf data/sub_dist_mesh2d.tgt` (`sub 5 2 3 6 7 9 dist 2 mesh2d 4 4`) to check_prog_gmap and CMake
    - it passes on the patched 32/64-bit trees.'''
compared_with_ours = '''
Our 7.0.17 0003 had the NULL-tolerant free, archInit(), flag inheritance, crloval >= 1 and the ARCHFREE mask; upstream's has the matching routines (archDistMatchInit/Exit/Mate, ArchDistMatch in ArchMatchDummy), which ours did not and which are a real improvement. Rebased 0003 keeps upstream's structure (inner Arch published after success, upstream's `bad input (1)/(2)` messages, upstream's variable name dstarchptr) and adds only the five missing pieces.

Upstream also added a regression test (0d878bdd), which ours did not.'''

