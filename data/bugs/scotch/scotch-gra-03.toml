[[imported."pyscotch-7.0.17-review".fix_options]]
label = "a. Validate while reading, build inverse permutation on the fly (committed)"
summary = "Read the count into a local and require it to equal ordeptr->vnodnbr; memSet peritab to ~0; for each line check rank in [baseval, vnodnbr+baseval[ and not yet assigned; set peritab directly. Removes the temporary permtab and the orderPeri call."
diff_file = "patches/G15-order-io-seq-misc/0001-Bugfix-validate-vertex-count-and-permutation-values-.patch"
tested = "repro/GRA-03 (6 files), fuzz before/after, check_scotch_graph_order + new round-trip and 4 invalid-file cases, 32/64-bit"
tradeoffs = "Rejects files whose count differs from the graph size (previously a smaller count was 'accepted' with a corrupted structure). No allocation any more. Lines must still be in vertex order (pre-existing, see PS2-G15-5)."
preferred = true
maintainer_fit = "Same marker idiom as his orderCheck() (order_check.c:156-172 memSet ~0 / 'invalid index' / 'duplicate index') and the read-loop validation of G14's graphLoad() patch; one fewer allocation."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "b. Keep orderPeri(), add a validation pass after reading"
summary = "Check count, then a separate loop over permtab with peritab as flag array before calling orderPeri()."
diff_file = "alt/G15-order-io-seq-misc/GRA-03-b-precheck-pass.diff"
tested = "untested: superseded by a, which is strictly simpler"
tradeoffs = "Keeps the temporary array and two passes; same behaviour."
preferred = false
maintainer_fit = "He would not keep an allocation whose only purpose is to be inverted afterwards."

