[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "0ef275a090"
verdict = "incomplete"
details = '''
**Right**

row indices are now range-checked unconditionally after decoding, and the error paths are factored through one fail: label (`graph_io_habo.c:236-240`, inside the EOF test block). Wrong bound: `> grafptr->vertnnd` accepts vertnnd (n+1), one past the last vertex; such a file loads and produces a graph that fails graphCheck (`invalid edge numbers`).

Style: missing parentheses around the two comparisons. Missing: intermediate column pointers are not checked (a decreasing pointer silently drops non-zeros; a large one drives habnzrnum past habnzrtab), field values and format numbers still accumulate in a signed int (UBSan at :270, :392, :425; EOF spin with huge widths).

The mesh twin meshGeomLoadHabo (G11) got nothing.'''
compared_with_ours = "Ours (7.0.17 0004) used `(habnzrval < 1) || (habnzrval > habcolnbr)`, which is exact. Upstream's fail: factoring is nicer and kept. Rebased as 0007 (bound fixed to `>= vertnnd` + column pointer checks), plus 0008 (header sizes) and 0009 (format widths, EOF, saturated decoding)."

