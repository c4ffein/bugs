[imported."pyscotch-7.0.18-new".upstream_fix_review]
commit = "a7692fbb30"
verdict = "incomplete"
details = '''
**Right**

renames, non-negative terminal labels/weights, type-1 labels/sizes/weights >= -1 and non-negative distances (`arch_deco.c:289-296`, 339-343, 356-357): `deco 0 ... -1 ...` (wneg) rejected, the negative type-1 distance that crashed graphMapView2 in 7.0.17 is now `bad input (6)`.

Missing: the terminal count check of archDecoArchBuild2() is still under SCOTCH_DEBUG_ARCH1 (`arch_deco.c:164-169`), so `deco 0 2 3 0 1 2 1 1 2 5` (duplicate terminal number) loads with 1 terminal; a terminal that is an ancestor of others (PS-COR-1) → `heap-buffer-overflow ... arch_deco.c:206 in _SCOTCHarchDecoArchBuild2`; termdommax is unbounded (`deco 0 1 70000` → `signed integer overflow: 69999 * 70000`); the overall terminal weight is unbounded (wbig → `signed integer overflow: 2000000000 + 2000000000` at `arch_deco.c:161`); type-1 domain arrays are not checked to form a tree (bad1.tgt → `heap-buffer-overflow ... arch_deco.c:512 in _SCOTCHarchDecoDomSize`, gmap → `arch_deco.c:538` archDecoDomDist).

Accepting size and weight -1 for type-1 slots is laxer than needed: archDecoArchSave() writes 0 for unused slots, only the label can be ARCHDOMNOTTERM. Style: the comments of `arch_deco.c:192-197` are misaligned (stylecheck).'''
compared_with_ours = "Our 7.0.17 0003 had all the missing checks (unconditional count check, leaf check, termdommax bound, weight sum, type-1 tree validation) and propagated the Build2 result, which 09cf49de now does. Rebased 0002 keeps upstream's structure, variable names and labels (fail1/fail2) and adds only the missing checks."

