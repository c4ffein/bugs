needs = ""
needs_note = ""
location = "src/libscotch/library_context.c:306-323 (switch (optinum), o || contextValuesSetInt), :341-382 (Parse: o |= ..., return (o)); no Fortran twin in library_context_f.c; no user-manual entry in doc/src/scotch/s_l.tex; consumer side: common_integer.c:313-324 (intRandInit seeds from compile-time flags only), context.c:96-107 (contextOptionsInit only stores the env value)"
evidence = "library_context.c:306 'switch (optinum) {' ; :323 'return (o || contextValuesSetInt ((Context *) libcontptr, optinum, optitmp));' ; :370 'o |= SCOTCH_contextOptionSetNum (libcontptr, argsptr->vtypidx, argsptr->vtypval);' ; :381 'return (o);'. git grep CONTEXTOPTIONNUMRANDOMFIXEDSEED src/libscotch -> context.c:104-105, library_context.c:307,315,337-338, dummysizes.c only; common_integer.c:317-321 '#if ! ((defined COMMON_DEBUG) || (defined COMMON_RANDOM_FIXED_SEED)) contptr->seedval = (INT) time (NULL); #else contptr->seedval = 1;'."
upstream_change = "0f793bf Bugfix: dynamic option setting strategy sets the proper parameters and returns the proper error value [report R. Perry] (switch (optinum); Parse accumulates and returns o)"
review_accuracy = "accurate on the switch and the ignored return value; its statement 'never forces a fixed random seed' remains true after the fix for a different reason (no consumer of the option), which the review did not identify."
notes = "The -C option of gmap/gpart/gord/dgmap/dgord is in the programs' usage text (gmap.c:106-112: 'd : deterministic behavior (even across multiple threads; implies f)') but not in man/man1/*.1.txt; not patched (generated .1 files would need regeneration). The 0f793bf fix is complete for the C API as far as the switch and the return value go; the Fortran SETNUM wrapper passes the return value through (library_context_f.c:199-208)."
severity = "medium"
severity_note = "Lower than the review's high: the dispatch bug and the ignored return value are fixed in 7.0.17; what remains is that the run-time 'fixed seed' option (and therefore the 'deterministic' option) does not fix the seed unless the library was compiled with COMMON_RANDOM_FIXED_SEED, which is the review's user-visible symptom ('deterministic runs are not deterministic') under another mechanism; plus a missing Fortran interface/doc."
ran = "repro/API-02/opt on 7.0.17 (both trees): 'SetNum (DETERMINISTIC, 1) = 0' then 'deterministic=1 fixedseed=1'; 'SetNum (7, 1) = 1' (invalid option name); 'Parse (\"d\") = 0'; 'Parse (\"x\") = 1' (return value propagated); 'Parse (\"d,r\") = 0' -> deterministic=1 fixedseed=0. repro/PS2-G06-1 (build without -DCOMMON_RANDOM_FIXED_SEED): two gpart runs 1.3 s apart with 'gpart -Cd' differ (4817 lines), with -Cf (4817), with SCOTCH_DETERMINISTIC=1 (5646/4817) -- the option is set but has no effect on the seed. repro/PS2-G06-2: Fortran interface absent in 7.0.17 (link error), present and working after patches/0005."
read_only = ""
why_not_run = ""
first_pass_critique = "Status 'fixed' is too generous: it verified that GetNum(RANDOMFIXEDSEED) reads 1 after SetNum(DETERMINISTIC,1) on the ASan build, which is compiled with -DCOMMON_RANDOM_FIXED_SEED, so it could not see that the option value is never read by the generator; it did not check for the Fortran twin or the user-manual entry (both absent) and did not notice the 'd,r' order dependence."
patch_files = ["patches/G06-threads-context/0005-Add-Fortran-interface-and-documentation-for-SCOTCH_c.patch"]
cleanup_done = "none needed"
test_added = ""
docs_updated = "doc/src/scotch/s_l.tex (new SCOTCH_contextOptionParse subsection; OPTIONNUMRANDOMFIXEDSEED name fixed)"
group = "G06-threads-context"
repro = "G06-threads-context/API-02"

