[[imported."pyscotch-7.0.17-review".fix_options]]
label = "B. Make the run-time fixed-seed option effective"
summary = "See extra PS2-G06-1 (alt/PS2-G06-1-a-reseed-when-option-set.diff): reseed the context generator with the COMMON_RANDOM_FIXED_SEED seed when the option is set by API, by Parse, or by the environment; and make SCOTCH_DETERMINISTIC=1 from the environment imply the fixed seed as the API does."
diff_file = "alt/G06-threads-context/PS2-G06-1-a-reseed-when-option-set.diff"
tested = "build_nofs_alt (no COMMON_RANDOM_FIXED_SEED): -Cf, SCOTCH_RANDOM_FIXED_SEED=1 and SCOTCH_DETERMINISTIC=1 give identical results across runs (3 trials each, 0 differing lines; unconfigured runs still differ)."
tradeoffs = "Design decision: it reseeds the (possibly global, shared) generator at every context initialization while the option is on, so successive library calls restart the same stream, unlike the compile-time flag, under which the stream continues across calls; see extra PS2-G06-1."
preferred = false
maintainer_fit = "Needs his decision on the semantics of a run-time seed option (once per process vs per context); not sent as a commit."

