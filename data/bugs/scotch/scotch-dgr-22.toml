evidence = "dgraph_fold.c:350-351: `MPI_Isend (orgedgeloctax + fldedgeidxtab[commnum], fldedgecnttab[commnum], GNUM_MPI, ...` (Gnum count into int parameter); :383: `vertsndnbr = (int) fldcommdattab[commnum].vertnbr;`; :452: `MPI_Waitall (commnbr, &requtab[DGRAPHFOLDTAGESIZ * commmax], MPI_STATUSES_IGNORE);` (return value ignored); dgraph_redist.c:217-218: `int drcvdatnbr; /* Amount of data to allocate */ int dsnddatnbr;`; :295: `dsndcnttab[2 * procngbnum + 1] += (int) (srcvendloctax[srcvertlocnum] - srcvertloctax[srcvertlocnum]);`"
upstream_change = ""
review_accuracy = "accurate; the redist int totals overflow earlier than the review implies (data words per destination = (3 or 4) * vertices + (1 or 2) * edges)."
notes = ""
severity = "low"
severity_note = "Only 64-bit builds moving more than 2^31 items to one process in one fold message or redistribution; below 2^32 MPI aborts the job, above it the graph is silently wrong."
ran = "64-bit Gnum flags, gcc -Wconversion on pristine files: dgraph_fold.c 22, hdgraph_fold.c 18, dgraph_redist.c 4 'conversion from Gnum to int may change value' (every MPI_Isend/Irecv count; redist :295 degree sum and the int accumulators). Boundary with the installed Open MPI (repro/DGR-22/mpicount.c): count 2147483648 -> int -2147483648 -> MPI_Isend MPI_ERR_COUNT; count 4294967300 -> int 4 -> 'silently sends 4 elements'. Patched library compiles warning-free in 32-bit and 64-bit; all check targets pass with the new checks as no-ops."
read_only = "The truncation inside a fold or redistribution (needs > 2^31 vertices or edges in one message) and the behaviour of the new checks on such inputs."
why_not_run = "A message of 2^31 Gnums is 16 GB per process; not reproducible here."
first_pass_critique = "Correct analysis. Its sketch checks per-communication vertex counts 'before the first agreement' where fldcommdattab is not yet available on senders, and puts the edge-count check 'at the gate of DGR-01's fix' without saying how the sender learns about it; it did not notice that commGatherv() (73229e6) gives the exact idiom to copy, nor that dgraphFoldComm() is the common place for the vertex bound, and it left the redist totals unpatched. The dead second-pass attempt also left the redist totals ('bounded by the Alltoallv interface'), which is wrong: the per-destination and per-process totals can overflow int silently before Alltoallv is ever called; I added those checks."
patch_files = ["patches/G18-dgraph-fold-redist/0003-Bugfix-make-error-handling-of-dgraphFold2-and-hdgrap.patch", "patches/G18-dgraph-fold-redist/0007-Bugfix-check-that-message-sizes-fit-in-MPI-count-arg.patch"]
cleanup_done = "int temporaries dstvertloctmp/dstedgeloctmp and the 'Preserve amount of data' copies removed from dgraphRedist2()"
test_added = "none: not exercisable below 16 GB per message"
docs_updated = ""
group = "G18-dgraph-fold-redist"
repro = "G18-dgraph-fold-redist/DGR-22"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A: reject sizes that do not fit, collectively (recommended)"
summary = "dgraphFoldComm() refuses to build a scheme when grafptr->vertglbmax (which bounds every vertex message) does not round-trip through int; receivers check each received edge count before allocating and fail through the collective gate of commit 0003; dgraphRedist2() computes flveval/fledval first, checks that the local amount of data to send fits in an int before the first agreement, accumulates the receive total as a Gnum and checks it before the second agreement (dstvertloctmp/dstedgeloctmp removed). The MPI_Waitall return value is checked in commit 0003."
diff_file = "patches/G18-dgraph-fold-redist/0007-Bugfix-check-that-message-sizes-fit-in-MPI-count-arg.patch"
tested = "Compiles warning-free in 32-bit (checks trivially false) and 64-bit. After the series: check_strat_par, check_scotch_dgraph_{check,band,coarsen,order,grow,induce,redist}, check_libparmetis_{v3,dual}, check_prog_{dgord,dgpart,dgscat-dggath,dgtst} all exit 0 on the 32-bit ASan+UBSan tree and on the 64-bit Gnum tree ($WORK/chk_32_*.log, chk_64_*.log; the only sanitizer lines are pre-existing ones in library_dgraph_coarsen.c:163 and bgraph_bipart_ml.c:195, other groups); check_scotch_dgraph_{check,coarsen,order,redist,induce} and check_prog_dgord also pass on an ASan -DSCOTCH_DEBUG_ALL tree (chk_dbg_*.log). Zero compiler warnings in the three trees. git am of the 7 patches on a fresh clone of v7.0.17 succeeds."
tradeoffs = "Conservative: a process with more than INT_MAX local vertices is refused by the fold even if it sends less; redist refuses a process whose local data would not fit even if split across destinations. No change below the limit."
preferred = true
maintainer_fit = "His commGatherv() check (73229e6): 'isndcntnbr = (int) sendcntnbr; if ((Gnum) isndcntnbr != sendcntnbr) { errorPrint (\"...: communication indices out of range (2)\"); goto fail; }'. He does not use MPI-4 large-count routines anywhere."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "B: local checks at each send site"
summary = "Check vertsndnbr and fldedgecnttab[commnum] right before the first Isend of each communication and check the Waitall; a failure jumps to the existing fail2 dispatch."
diff_file = "alt/G18-dgraph-fold-redist/DGR-22-B-local-checks-at-send-sites.diff"
tested = "compiles (mpicc -c, 64-bit flags, 0 warnings); not run"
tradeoffs = "Not collective: the receivers wait forever for the data of a sender that refused; on pristine 7.0.17 this is yet another hang path. Only acceptable on top of option A of DGR-01."
preferred = false
maintainer_fit = "Local checks that abort a collective pattern are what he removed in his 7.0.17 reworks."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "C: split messages above INT_MAX (derived datatype or chunk loop)"
summary = "Send n / 2^20 blocks of a committed contiguous type plus a remainder on each of the seven message kinds and size the request array accordingly; rewrite the redist Alltoallv as point-to-point."
diff_file = ""
tested = "untested: not written, design only"
tradeoffs = "Truly supports > INT_MAX items but touches every send/receive pair, the request slot layout (DgraphFoldTag) and the redist exchange scheme."
preferred = false
maintainer_fit = "Far beyond a bugfix; he would schedule it as a feature if at all."

