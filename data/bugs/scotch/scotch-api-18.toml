[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "27f4193c38"
verdict = "wrong"
details = "Upstream applied the review's formula verbatim, which our 7.0.17 audit had already flagged as off by a factor two: the distributed sums are edge-once (CommDilat at `library_dgraph_map_view.c:135` divides by edgeglbnbr / 2) but edgeglbnbr counts arcs. Result: the weighted case moved from 0.406780 to 1.314211 (right value 0.657106), and the unweighted case, which was right in 7.0.17 (1.000000), is now 2.000000: a regression for every dgmap -v user (filed as PS3-G16-1). 32/64-bit identical."
compared_with_ours = "Our 7.0.17 0007 used `(grafptr->edgeglbnbr / 2)`, the same expression as the CommDilat line, and was verified line-for-line against SCOTCH_graphMapView. Ours is right; the rebased 0006 changes only that factor on top of upstream's formula."

