7.0.17 :217-219 `if (((vsize != NULL) && (vsize != ne)) || ... (options[METIS_OPTION_OBJTYPE] == METIS_OBJTYPE_VOL))) o = _SCOTCH_METIS_OutputVol (baseval, ..., vsize - baseval, *nparts, ...);`
7.0.17 :109 `if ((options != NULL) && (options != ne)) /* For the Fortran interface, null arrays are those equal to ne */`'''
upstream_change = ""
review_accuracy = "Accurate on all three points. Its 'Fix:' line works as written, but 'normalise vsize equal to ne to NULL' alone would still return a communication volume for the default objective whenever vsize is given (inconsistent with G25's CLI-19 fix of the graph routines), hence the second commit."
notes = "0002 is the PartMeshDual twin of G25's CLI-19 commit 53c5f79 (objective from OBJTYPE only, vsize ignored for the edge cut): without it, a caller passing vsize with the default objective gets a volume while the graph routines now return a cut. Behaviour change documented in s_l.tex. The extra instance in metis_graph_part.c (V5 Volume path with a Fortran-null vsize == xadj) is G25's file; vwgt == xadj is harmless there because SCOTCH_graphBuild() treats velotab == verttab as NULL, but vsize == xadj is read as sizes (wrong volume, no crash). Left for G25/the maintainer, listed here."
severity = "medium"
severity_note = "Public METIS API argument; a Fortran caller passing the documented-by-code 'ne' null array crashes (stack over-read), a C caller asking METIS_OBJTYPE_VOL without vsize and base 1 crashes; same as the review."
ran = '''
ASan build of base-combined (= 7.0.17 + 20 groups, libscotchmetis untouched for these lines), $WORK/repro/CLI-05/pm_firstpass.c:
  ./pm 2  (vwgt == &ne, base 1) -> ==ERROR: AddressSanitizer: stack-buffer-overflow ... READ of size 4 ... #0 SCOTCH_graphBuild library_graph.c:262 #1 SCOTCH_METIS_PartMeshDual metis_graph_part_dual.c:209
  ./pm 0  (OBJTYPE=VOL, vsize=NULL, base 1) -> metis_graph_part_dual.c:222:11: runtime error: applying non-zero offset 18446744073709551612 to null pointer; metis_graph_part.c:172:24: ... produced null pointer (SEGV in _SCOTCH_METIS_OutputVol)
  same against pristine $INFRA/asan (7.0.17): stack-buffer-overflow at metis_graph_part_dual.c:206.
Patched: modes 0..3 -> ret=1 objval=20/20/10/10, no sanitizer report. The patched src/check/test_libmetis_dual.c against the pristine library: base 0 -> stack-buffer-overflow, base 1 -> UBSan null-pointer offset + crash; against the patched library: passes. Regression runs with the full series (base-combined + 0001..0008), 32-bit and 64-bit ASan+UBSan trees: check_libmetis_v3, check_libmetis_v5, check_libmetis_dual_v3, check_libmetis_dual_v5, check_libmetis_dual_f_v3, check_libmetis_dual_f_v5, check_libesmumps, `make escheck`, check_libparmetis_v3 (now also with 3 processes), check_prog_dgord: all pass, 0 compiler warnings (logs $WORK/build*.check_*.log, $WORK/build*.escheck.log, $WORK/build*.full.log).'''
read_only = ""
why_not_run = ""
first_pass_critique = "Status, method and evidence correct. Its preferred diff introduces two new pointers but keeps a duplicated 9-line cleanup block for the graphBuild failure (the file's twin `_SCOTCH_METIS_PartGraph2()` nests the map inside `if (SCOTCH_graphBuild (...) == 0)` instead), keeps the raw `options[METIS_OPTION_OBJTYPE]` read (misses the -1 default handled by G25's `_SCOTCH_METIS_optionGet()`), adds no test, and leaves the vsize-implies-volume selection that G25 removed from the graph routines. Its option 2 (shared helper) is the alt diff CLI-05-b."
patch_files = ["patches/G26-metis-dual-esmumps/0001-Bugfix-apply-the-Fortran-null-array-convention-to-al.patch", "patches/G26-metis-dual-esmumps/0002-Select-the-partitioning-objective-of-METIS_PartMeshD.patch"]
cleanup_done = "The `else o = METIS_ERROR;` branch and the second strat init/exit pair are gone (nesting); nothing else became unused. 0002 removes the unconditional vsize-implies-volume branch."
test_added = "src/check/test_libmetis_dual.c: checkPart() factored, calls with vwgt=vsize=&ne (Fortran null), with OBJTYPE=VOL and vsize=NULL, with vsize and VOL; checkObjval() verifies objval against the dual graph of the same ncommon for cut and volume. src/check/test_libmetis_dual_f.f90.in: second call passing ne (as array element netab(1), the only form gfortran accepts next to the array call) for vwgt and vsize, with the same checks."
docs_updated = "doc/src/scotch/s_l.tex (METIS_PartMeshDual: NUMBERING and OBJTYPE supported, vsize used for the communication volume) in 0002"
