[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A. Save the master thread state in threadContextImport1() (recommended)"
summary = "First statement of threadContextImport1(): 'threadProcessStateSave (contptr); /* Save state of master thread */', mirroring threadContextInit():112. Regression check in test_scotch_context.c (COMMON_PTHREAD_AFFINITY_LINUX only)."
diff_file = "patches/G06-threads-context/0003-Bugfix-save-state-of-master-thread-when-importing-a-.patch"
tested = "repro/COR-11 on both trees (mask preserved), TSan 0 warnings; check_scotch_context (which now compares sched_getaffinity before Import1 and after contextExit) passes at 1/2/4 threads on both trees."
tradeoffs = "One pthread_getaffinity_np() per import, including the two sub-contexts of every contextThreadLaunchSplit() (negligible). Split sub-contexts keep using threadContextExit2 (no restore), unchanged."
preferred = true
maintainer_fit = "The maintainer paired Init with save and Exit with restore, and gave sub-contexts Exit2 ('without restoring the thread affinity mask', common_thread.c:161-168); the import entry point is the only creator that broke the pairing. One line, same comment as line 112."

[[imported."pyscotch-7.0.17-review".fix_options]]
