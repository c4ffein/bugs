commit = "59c9a31c8b"
verdict = "incomplete"
details = '''
Right for dorderSave(): the array is based before the gather and the late basing is removed (output verified correct at np=1 and 3). Missing: the twin dorderSaveTree2() (`dorder_io_tree.c:116-157`), which the review listed in the same lead, still overflows (ASan and glibc aborts above).

New defect: the basing runs on non-root processes too, where vlbltax is never initialized (`dorder_io.c:115` sets only permtab), i.e. pointer arithmetic on an indeterminate value (UBSan reports it as an offset on a null pointer on the ASan tree); dmapSave() has the same NULL basing since 4290e22 (PS2-G23-1).

Style: the two new lines are indented by 3 spaces (`dorder_io.c:144`, :146), against the 2-space rule. The vlblnbr → vlblsiz rename is right (it is a size).'''
compared_with_ours = "Our 7.0.17 0005 also initialized vlbltax to NULL, based it on the root only, fixed dorderSaveTree2 (renamed vlbltab to vlbltax, freed vlbltax + baseval) and added a based, labelled graph to check_prog_dgord. Ours is complete; upstream's takes the dmapSave comment text, which we now reuse. Rebased as 0003: tree writer + NULL init/guard + indentation + check line."

