method = "partly-run"
needs = ""
needs_note = ""
location = "src/libscotchmetis/metis_graph_dual.c:112-118 (dangling *xadj), :97-108 (no meshExit/graphExit on build failure); src/libscotchmetis/parmetis_dgraph_dual.c:150-173 (malloc/memFree), :158-162 (DEBUG_ALL return without cleanup), no NULL outputs on error"
evidence = '''
metis_graph_dual.c:115-118 `if (*xadj != NULL) free (*xadj); SCOTCH_graphExit (&grafdat); return (METIS_ERROR_MEMORY);` after `*xadj = NULL; /* Assume something will go wrong */` at :92 (so callers rely on the NULL test);
parmetis_dgraph_dual.c:150 `vertloctab = malloc (...) /* Use plain malloc() because of user-managed array */` vs :167-170 `memFree (edgeloctab); ... memFree (vertloctab);`; :159-162 `if (MPI_Allreduce (...) != MPI_SUCCESS) { ...; return (METIS_ERROR); }`'''
upstream_change = ""
review_accuracy = "Mostly accurate; wrong on one detail: METIS_MeshToDual does call SCOTCH_graphExit() in its OOM branch (:117). Its fix line is right; it misses that the distributed twin never sets its output pointers on error although its METIS v3 Fortran stub has no return value either."
notes = "The meshGraphDual double free found while fault-injecting this item is PS2-G26-1 (patch 0004, also graphLoad/Chaco/meshGraphNodal)."
severity = "medium"
severity_note = "Raised from the review's low: on OOM the C test program and any Fortran caller (no return value) double-free and read a freed array; the ParMETIS parts stay low."
ran = '''
Plain (non-sanitized) build of base-combined, LD_PRELOAD fault injector $WORK/repro/tools/failmalloc.so, driver $WORK/repro/CLI-15/m2d_fail.c (test_libmetis_dual.c's mesh, caller tests xadj == NULL as the test and the Fortran interface do):
  FAILMALLOC_FUNC=SCOTCH_METIS_MeshToDual FAILMALLOC_NTH=2 ./m2d_fail -> ERROR: SCOTCH_METIS_MeshToDual: out of memory / free(): double free detected in tcache 2 (abort)
  (FAILMALLOC_AT sweep N=1..8: N=7 is this case; N=1..6 return -4 with xadj=(nil))
  patched: METIS_MeshToDual returned -3; xadj=(nil) adjncy=(nil) / caller: error detected through xadj == NULL
Distributed twin $WORK/repro/CLI-15/pm2d_fail.c, mpirun -np 2 -x FAILMALLOC_FUNC=SCOTCH_ParMETIS_V3_Mesh2Dual -x FAILMALLOC_NTH=1|2: base -> returned -3, xadj=0x1 adjncy=0x1 (outputs untouched); patched -> xadj=(nil) adjncy=(nil). Regression runs with the full series (base-combined + 0001..0008), 32-bit and 64-bit ASan+UBSan trees: check_libmetis_v3, check_libmetis_v5, check_libmetis_dual_v3, check_libmetis_dual_v5, check_libmetis_dual_f_v3, check_libmetis_dual_f_v5, check_libesmumps, `make escheck`, check_libparmetis_v3 (now also with 3 processes), check_prog_dgord: all pass, 0 compiler warnings (logs $WORK/build*.check_*.log, $WORK/build*.escheck.log, $WORK/build*.full.log).'''
read_only = "The memFree()/free() mismatch (visible only with COMMON_MEMORY_TRACE/CHECK) and the SCOTCH_DEBUG_ALL early return (needs MPI_Allreduce to fail) were read, not run."
why_not_run = "A COMMON_MEMORY_CHECK build and an MPI fault were not set up; the double free and the NULL outputs were run."
first_pass_critique = "Correct status and the graphExit correction; method 'source-read' although an LD_PRELOAD injector settles it in minutes; its sketch keeps the malloc on a line with `sizeof(SCOTCH_Num)` (missing space) and does not NULL the outputs of the distributed twin nor free the mesh on a failed meshBuildElem."
patch_files = ["patches/G26-metis-dual-esmumps/0003-Bugfix-clean-up-properly-on-error-in-METIS_MeshToDua.patch", "patches/G26-metis-dual-esmumps/0004-Bugfix-reset-freed-vertex-array-in-graph-builders-on.patch"]
cleanup_done = "The `SCOTCH_graphInit()` call before the mesh build was moved after it (no graph to exit on a mesh failure); the hard `return (METIS_ERROR)` in the debug branch is gone; nothing left unused."
test_added = "none: src/check has no failing-allocation tests (precedent: no OOM test anywhere in src/check); the reproducers under repro/CLI-15 cover it."
docs_updated = ""
group = "G26-metis-dual-esmumps"
repro = "G26-metis-dual-esmumps/CLI-15"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "NULL outputs on entry in both routines, free() for malloc(), common exit for the debug path (chosen)"
summary = "Sequential: `*xadj = *adjncy = NULL` on entry, meshExit/graphExit on every failure, `*xadj = NULL` after the free. Distributed: outputs NULL on entry, free() instead of memFree(), communication error sets chekglbval and goes through the existing abort labels, status METIS_ERROR_MEMORY only when the local allocation failed."
diff_file = "patches/G26-metis-dual-esmumps/0003-Bugfix-clean-up-properly-on-error-in-METIS_MeshToDua.patch"
tested = "m2d_fail / pm2d_fail before and after; check_libmetis_dual_* and check_libparmetis_v3 in both trees."
tradeoffs = "None visible to callers that already test the return value; Fortran callers now get NULL on all failures."
preferred = true
maintainer_fit = "Mirrors the sequential routine's own `/* Assume something will go wrong */` idiom and the file's `/* Use plain malloc() because of user-managed array */` comment; abort labels already exist in the distributed routine."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Allocate into locals and publish the outputs only on success"
summary = "MeshToDual keeps `xadjtab`/`adjntab` locals and assigns `*xadj`/`*adjncy` after the copies; nothing to reset after a free."
diff_file = "alt/G26-metis-dual-esmumps/CLI-15-b-local-arrays.diff"
tested = "untested: equivalent control flow, not built."
tradeoffs = "Two more locals; still needs the NULL-on-entry for the Fortran interface; does not cover the distributed twin by itself."
preferred = false
maintainer_fit = "More lines for the same effect; he uses the output pointer directly elsewhere in libscotchmetis."

