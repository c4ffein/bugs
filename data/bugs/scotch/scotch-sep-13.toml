upstream_change = ""
review_accuracy = "Mechanism, location and fix line are accurate. Incomplete for its own claim 'non-reproducible runs even in deterministic mode': spawning before the launch makes runs reproducible for a fixed thread count only; the documented contract is independence from the thread count, which needs the option to be honored (second commit)."
notes = "Measured contract after the series: SCOTCH_DETERMINISTIC=1 gives one partition per thread count (30/30) and 2 == 4 == 8 threads; 1 thread still differs on some graphs because of PS2-G08-2 (not this module). Default/non-deterministic mode remains non-reproducible by design (lock-free matching)."
severity = "high"
severity_note = "Higher than the review's Medium: the race is reachable from the default strategy (bgraphBipartFm and bgraphBipartEx fall back to bgraphBipartGg) and breaks the documented contract of SCOTCH_OPTIONNUMDETERMINISTIC ('deterministic behavior across multiple runs, for any number of threads', s_l.tex:7900-7908), a 7.0.16 regression against 7.0.13-7.0.15."
ran = "ThreadSanitizer (-O1 -fsanitize=thread, 4 threads) on pristine 7.0.17: 'WARNING: ThreadSanitizer: data race ... Write of size 8 by main thread: #0 _SCOTCHintRandVal3 common_integer.c:443 #1 _SCOTCHintRandVal #2 bgraphBipartGg2 bgraph_bipart_gg.c:196 ... Previous read by thread T3: #0 _SCOTCHintRandSpawn common_integer.c:296 #1 bgraphBipartGg2 bgraph_bipart_gg.c:177' (1 per run, 3/3 runs). Fresh-process determinism, SCOTCH_DETERMINISTIC=1, gpart 4 m16x16_b100000_v.grf, 30 runs: pristine thr=2 -> 3 distinct partitions (24/4/2), thr=4 -> 1 (racy side varies per run); after 0002 alone: thr=1/2/4 -> 1 distinct each but three different partitions (1d497d7d, d02c4de7, 944fb99a); after 0001-0004: thr=2/4/8 -> 1 distinct, all e180dfcf; 64-bit build the same. Patched TSan: 0 reports with SCOTCH_DETERMINISTIC=1 (5 runs), and with =0 only the intentional lock-free matching in graph_match_scan.c (5 runs). repro/SEP-13/README."
read_only = ""
why_not_run = ""
first_pass_critique = "Status and TSan evidence right; the sketch (spawn loop in the launcher, randdat in BgraphBipartGgThread) is what 0002 does. It called the deterministic-option half 'handled elsewhere by the parent' and never audited PyScotch's shipped patch; that patch is questioned here: (1) its '(descptr != NULL) ? threadNum (descptr) : 0' guard exists only because it calls bgraphBipartGg2 (NULL, ...) in the threaded build; the tree's idiom for 'deterministic => sequential' is graphMatch() (graph_match.c:286-291): launch all threads, non-zero threads return at once, so 0003 adds a working-thread count to BgraphBipartGgData instead and leaves the launch and the descriptor alone; (2) collapsing to one working thread is required (the doc promises thread-count independence), as PyScotch did, but through contextThreadNbr-sized tables, not by changing thrdnbr; (3) the '#include \"context.h\"' is needed (CONTEXTOPTIONNUMDETERMINISTIC lives there, as in graph_match.c:57); (4) contdat/contptr juggling stays: thread 0 must keep using the caller's context so that the sequential and deterministic results coincide (verified: thr=1 result unchanged, 1d497d7d, after the series). Its option 'derive the spawn seed from the stable seed' is wrong as written: successive calls in one context would give identical worker streams (alt/SEP-13-c, not recommended)."
patch_files = ["patches/G08-bgraph-gg-gain/0002-Bugfix-spawn-thread-pseudo-random-contexts-before-th.patch", "patches/G08-bgraph-gg-gain/0003-Bugfix-honor-deterministic-option-in-bgraphBipartGg-.patch"]
cleanup_done = "0002 removes the local 'IntRandContext randdat' of bgraphBipartGg2 and its worker-side intRandSpawn call; the 'Create fake local context' comment is replaced. intRandSpawn keeps its single caller (the launcher). Nothing else orphaned (git grep)."
test_added = "; a '1 thread == N threads with the option set' test in test_scotch_context.c would be the natural home, but it fails on pristine+series for a reason outside this module (PS2-G08-2: kgraph_map_rb_part.c splits the context with a second random stream whenever >= 2 threads exist), so adding it would pin a contract the library does not yet meet; a same-thread-count reproducibility test would be flaky-detecting on pristine (fails in ~1 run of 5) and the maintainer does not ship probabilistic tests."
docs_updated = ""
group = "G08-bgraph-gg-gain"
repro = "G08-bgraph-gg-gain/SEP-13"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "a: spawn all local contexts in the launcher before contextThreadLaunch (0002) + honor the deterministic option the graphMatch way (0003)"
summary = "0002: IntRandContext randdat moves into BgraphBipartGgThread, the launcher spawns thrdtab[1..n-1].randdat sequentially, the worker uses &thrdptr->randdat. 0003: read CONTEXTOPTIONNUMDETERMINISTIC, store the number of working threads in BgraphBipartGgData.thrdnbr (1 if deterministic), share passes over it, non-working threads return at once with parttab = NULL (already the 'skip' marker of the reduction)."
diff_file = ""
tested = "32/64-bit builds 0 warnings; six check targets pass on both; TSan 0 reports (det=1) / only graph_match_scan.c (det=0); 30 fresh processes x {2,4,8} threads -> one partition each, identical across 2/4/8; debug build (-DSCOTCH_DEBUG_ALL) gpart 1 and 4 threads ok."
tradeoffs = "Non-deterministic mode: results now depend only on the thread count (same seeds as the first scheduling of pristine). Deterministic mode: GG runs on one thread (slower, as the doc says 'albeit sometimes slower'); idle threads cost a launch and a barrier. +32 bytes per thread in the internal thread block; no ABI change."
preferred = true
maintainer_fit = "0002 is the review's own fix and intRandSpawn's header comment already asks for it ('spawning can be performed in parallel ... The routine itself is not thread-safe'). 0003 copies graphMatchInit/graphMatch (graph_match.c:205-212, 286-291: 'Only thread 0 will perform the work') and the Gnum deteval + contextValuesGetInt idiom used in all three existing users of the option."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "b: PyScotch's shipped patch (collapse thrdnbr to 1 and call bgraphBipartGg2 (NULL, ...) directly)"
summary = "Same pre-spawning, but when deterministic sets thrdnbr = 1, calls the thread routine with a NULL descriptor and guards threadNum() with 'descptr != NULL'."
diff_file = "alt/G08-bgraph-gg-gain/SEP-13-b-pyscotch-null-descriptor.diff"
tested = "Not re-run here; PyScotch reports 3 x 30 fresh processes, 2 and 4 threads, one partition (QUESTIONS_FOR_SCOTCH_TEAM.md). Behaviourally equivalent to (a) in deterministic mode."
tradeoffs = "Works, but introduces a NULL-descriptor convention in a threaded build that no other module has (NULL is only ever passed in *NOTHREAD builds where threadNum is not called), and a ternary on every thread entry."
preferred = false
maintainer_fit = "He would rewrite it into (a): graphMatch keeps the launch and lets non-zero threads return."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "c: make intRandSpawn seed from seedval instead of the live state"
summary = "common_integer.c: seedval = roldptr->seedval, so spawning never reads mutable state."
diff_file = "alt/G08-bgraph-gg-gain/SEP-13-c-spawn-from-seed.diff"
tested = "compile-checked only (0 diagnostics); not run because it is wrong by design (see tradeoffs)."
tradeoffs = "Race-free at every caller, but every call of bgraphBipartGg() in the same context gives worker k the same stream (seedval never changes), so all bipartitions of a recursive bisection would grow from the same root sequence; needs a per-context call counter, i.e. a new field in IntRandContext."
preferred = false
maintainer_fit = "Changes the semantics of a common routine for one caller; he fixed callers, not common_integer.c, in this range."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "d: barrier inside the thread routine after spawning"
summary = "Workers spawn first, all threads hit threadBarrier before any draw; spawn moved before the allocation so the barrier is reached on every path."
diff_file = "alt/G08-bgraph-gg-gain/SEP-13-d-barrier.diff"
tested = "compile-checked only (0 diagnostics); not run."
tradeoffs = "One more barrier per call; the barrier must stay before every early return (allocation failure) or the call deadlocks; does nothing for the deterministic option."
preferred = false
maintainer_fit = "More fragile than spawning in the launcher, where contextThreadLaunchSplit (common_context.c:298-299) already seeds the second sub-context before launching."

