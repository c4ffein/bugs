[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "bca5f63b1e"
verdict = "correct"
details = '''
Adds the trailing int \* revaptr documented in p_l.tex:3138 and stores the C return value. ABI: the Fortran symbol now takes 17 arguments instead of 16. Callers written from the manual (which always listed ierr) were already passing it and now get it written; callers written against the old 16-argument wrapper (undocumented usage) now make the wrapper store through whatever the 17th argument slot holds (stack garbage), i.e. a likely crash.

No caller in the Scotch tree (no Fortran source references dgraphmapstat) and PyScotch uses the C API through ctypes, so nothing in our scope breaks. Leaves a TAB in the untouched continuation line ` mapavgptr, mapdltptr,<TAB><TAB>` (`library_dgraph_map_stat_f.c:88`), which our version had replaced by spaces; cosmetic.

Manual order mapmax/mapmin still swapped (PS-API-6).'''
compared_with_ours = "Same code as our 7.0.17 0002 except the tab cleanup. Ours dropped."

