id = "CLI-09"
area = "CLI"
our_title = "ParMETIS_V3_NodeND status tied to the sizes tree, not to the ordering it computed"
claimed_severity = "medium"
status = "still-present"
method = "partly-run"
needs = ""
needs_note = ""
location = "src/libscotchmetis/parmetis_dgraph_order.c:122 (o = METIS_ERROR), :150-151 (Compute/Perm unchecked), :206-210 (o = METIS_OK only inside the sizes/power-of-two branch)"
evidence = "7.0.17 :150-151 `SCOTCH_dgraphOrderCompute (&grafdat, &ordedat, &stradat); SCOTCH_dgraphOrderPerm (&grafdat, &ordedat, order);`\n:206-209 `if ((rootnum >= 0) && (sizes != NULL)) { memSet (sizes, 0, ...); _SCOTCH_ParMETIS_V3_NodeNDTree (...); o = METIS_OK; }`\ndoc/src/ptscotch/p_l.tex:5196-5204: 'this routine will compute an ordering even when the number of processors ... is not a power of two ... else [sizes] is filled with -1 values'"
upstream_change = ""
review_accuracy = "Accurate. ParMETIS 4.0 (libparmetis/ometis.c) returns METIS_OK unless the input check fails, fills `sizes` (2*npes entries: npes subdomain sizes then separators) and has no power-of-two restriction (it rounds the level count down); Scotch's doc keeps its -1 convention for non-powers of two, which the patch preserves."
notes = "With sizes != NULL on some processes only, the collective CblkDist/TreeDist calls still run on all of them (unchanged), so the fix introduces no new collective mismatch."
severity = "medium"
severity_note = "Public ParMETIS API: a correct call on 3, 5, 6... processes returns an error code that MUMPS/PETSc-style callers treat as fatal; same as the review."
ran = '''
ASan base-combined build, $WORK/repro/CLI-09/pn_firstpass.c (16x16 grid), ASAN_OPTIONS=detect_leaks=0 mpirun --oversubscribe:
  -np 3 -> rank 0/3 sizes=buf: ret=-4 (METIS_OK=1) order range [0,244]; ranks 1,2 ret=-4 too; -np 1,2,4 -> ret=1
  -np 1,2,4 with sizes=NULL -> ret=-4 on every rank although order is filled.
Completeness of the order at np=3: the shipped test_libparmetis_v3 (checkOrder gathers the permutation and checks bijectivity) on data/bump.grf: base -> 'main: error in ParMETIS_V3_NodeND', mpirun exit 1 (the ordering itself passes checkOrder only because the program exits before); patched -> exit 0 at np=3 and np=4, and the new checkSizes() verifies sizes sums to vertglbnbr at np=4 and is all -1 at np=3. Regression runs with the full series (base-combined + 0001..0008), 32-bit and 64-bit ASan+UBSan trees: check_libmetis_v3, check_libmetis_v5, check_libmetis_dual_v3, check_libmetis_dual_v5, check_libmetis_dual_f_v3, check_libmetis_dual_f_v5, check_libesmumps, `make escheck`, check_libparmetis_v3 (now also with 3 processes), check_prog_dgord: all pass, 0 compiler warnings (logs $WORK/build*.check_*.log, $WORK/build*.escheck.log, $WORK/build*.full.log).'''
read_only = "The 'METIS_OK on failed Compute/Perm' half: after the patch `o` stays METIS_ERROR unless both calls return 0; forcing a failure inside PT-Scotch's distributed ordering was not attempted."
why_not_run = "No cheap fault point inside SCOTCH_dgraphOrderCompute() on a valid graph (its allocations happen on every process and MPI's tens of thousands of allocations make a blind sweep impractical)."
first_pass_critique = "Status/evidence right. Its sketch sets o = METIS_OK only after Perm but leaves the separator-tree block running regardless of the ordering status (it would walk an incomplete ordering); it proposes no test although check_libparmetis_v3 runs only with 4 processes (EXECP4) and so never saw the non-power-of-two failure."
patch_files = ["patches/G26-metis-dual-esmumps/0005-Bugfix-return-the-ordering-status-from-ParMETIS_V3_N.patch"]
cleanup_done = "Inner `o = METIS_OK` removed; stale 'not used' comments on `sizes` fixed; trailing whitespace at :174 removed."
test_added = "src/check/test_libparmetis.c: checkSizes() (sum of the 2p-1 sizes == vertglbnbr when p is a power of two, all -1 otherwise); src/check/Makefile + CMakeLists.txt: test_libparmetis_v3 also run with 3 processes (EXECP3 / MPIEXEC 3)."
docs_updated = ""
group = "G26-metis-dual-esmumps"
repro = "G26-metis-dual-esmumps/CLI-09"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Status from Compute/Perm; sizes best effort, tree walked only on success (chosen)"
summary = "`o = METIS_OK` iff both ordering calls return 0; the separator-tree block runs only then and when the process count is a power of two; the inner `o = METIS_OK` is removed; sizes keep their -1 preset otherwise. check_libparmetis_v3 gains a 3-process run (Makefile + CMake) and checkSizes()."
diff_file = "patches/G26-metis-dual-esmumps/0005-Bugfix-return-the-ordering-status-from-ParMETIS_V3_N.patch"
tested = "pn at np=1..4 with/without sizes; test_libparmetis_v3 at np=3 and 4 in both trees."
tradeoffs = "Behaviour change: non-power-of-two runs now return METIS_OK (documented behaviour); callers that used the error to detect 'no sizes' must test sizes[0] == -1 instead (as the doc says)."
preferred = true
maintainer_fit = "Matches his p_l.tex description of the routine; the test addition follows 261f1c7 (Add tests for libparmetis) and the EXECP3 lines of check_prog_dgord."

