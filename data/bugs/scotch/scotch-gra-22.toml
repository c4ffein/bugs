[[imported."pyscotch-7.0.17-review".fix_options]]
label = "a. Run strategy once, compute column loads in ordering order, split leaves recursively (committed)"
summary = "hgraphOrderBl() runs the strategy, builds vnlotab (loads indexed by ordering number; via peritab for original graphs, by sorting (vnumtax, velotax) and (peritab, position) pairs with intSort2asc1 for induced subgraphs), then static hgraphOrderBl2() walks the tree with the ordering offset of each sub-block and splits leaves; trailing zero-weight columns go to the last block; a split yielding one block is undone. hmeshOrderBl() gets the same split between strategy and static hmeshOrderBl2()."
diff_file = "patches/G15-order-io-seq-misc/0007-Bugfix-split-column-blocks-according-to-the-computed.patch"
tested = "repro/GRA-22 (7 strategies, 32/64-bit), mord twin, check_prog_gord/gord_block/gotst/mord"
tradeoffs = "Two temporary arrays (n and 4n Gnums) on weighted induced subgraphs; block boundaries change for weighted graphs (intended); SEQU nodes with a single child are no longer produced."
preferred = true
maintainer_fit = "Static '2' helper declared in the .h under the file marker (his hgraph_order_cp.h:95-97 idiom); intSort2asc1 pair matching as in mapLoad (mapping_io.c:158); behaviour is the one his manual documents."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "b. Minimal: loads through peritab only for original graphs, comment the recursion"
summary = "Restore velotax[peritab[...]] when vnumtax == NULL, keep vertex order for induced subgraphs; does not fix the recursion nor zero loads."
diff_file = "alt/G15-order-io-seq-misc/GRA-22-b-minimal-top-level-loads-no-rerun.diff"
tested = "untested"
tradeoffs = "Leaves ND leaves (the main use of 'b', e.g. check_prog_gord's ole=b) unbalanced and the hang in place."
preferred = false
maintainer_fit = "Not a fix of the documented semantics; he already rejected the peritab indexing in a90b1cb."

