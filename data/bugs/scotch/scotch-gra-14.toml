diff_file = "patches/G15-order-io-seq-misc/0008-Bugfix-report-allocation-failures-in-graphCoarsen-an.patch"
tested = "injection sweeps 1/4 threads + match mode, 32/64-bit; check_scotch_graph_coarsen/map, check_prog_gpart"
tradeoffs = "On 'cannot coarsen' (retuval 1) a mating array allocated for a DSTMATE caller is now freed instead of leaked (callers never received it)."
preferred = true
maintainer_fit = "graphFree() on the partially built graph as in his own SCOTCH_DEBUG_GRAPH2 path (graph_coarsen.c:559-562); retuval is the channel he designed ('volatile int retuval')."

