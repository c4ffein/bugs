diff_file = "patches/G15-order-io-seq-misc/0002-Bugfix-validate-ordering-data-read-by-esMUMPS-orderL.patch"
tested = "repro/CLI-23 modes 0-6 pristine vs patched; check_libesmumps 32/64-bit"
tradeoffs = "Files with empty column blocks or inconsistent range arrays are now rejected at load time (orderCheck() already rejected them)."
preferred = true
maintainer_fit = "Twin of the libscotch orderLoad() fix (0001) and of his esMUMPS orderCheck() checks (order_check.c:96-104, 112-125)."

