[imported."pyscotch-7.0.17-review"]
id = "DGR-04"
area = "DGR"
our_title = "User permutation to SCOTCH_dgraphRedist corrupts edges: in-place unpack assumes receive order"
claimed_severity = "high"
status = "still-present"
method = "ran"
needs = ""
needs_note = ""
location = "src/libscotch/dgraph_redist.c:353-357 (shared block), :425-436 (positions recorded in receive order), :439-472 (unpack in destination order), :469 (memCpy); src/libscotch/library_dgraph_redist.c:104-107 (user permgsttab passed through)"
evidence = "dgraph_redist.c:354-355: `&dstedgeloctax, (size_t) ((dstedlolocsiz + /* TRICK: extra space required only if edge loads */ MAX (dstedgelocdlt, srcgrafptr->degrglbmax)) * sizeof (Gnum)), /* TRICK: degrmax to avoid overlap */`; :433: `dstvlblloctax[dstvertlocnum] = drcvdatidx; /* TRICK: record data position in label array */`; :469: `memCpy (dstedgeloctax + dstedgelocnum, drcvdattab + drcvdatidx, dstdegrval * sizeof (Gnum)); /* TRICK: will never overlap */` (dstedgelocnum increases in destination order while drcvdatidx is the receive-order position)"
upstream_change = ""
review_accuracy = "Accurate, including the reversed-4-cycle-to-an-empty-rank example. Its second fix ('compute destination offsets by prefix sum and unpack in receive order') is wrong: writes would then land ahead of the read position inside the shared block and overwrite unread records; only a non-overlapping destination area works."
notes = "The 'packs of 3 vertices' scheme of the existing test does not expose the bug even with a reversed permutation (each receiver's own send buffer pads the gap), which is why the new case sends everything to one process."
severity = "high"
severity_note = "Public API, documented usage (permgsttab 'must be valid' for local and ghost vertices, any order), release builds return 0 with a wrong graph; needs a receiver whose own send buffer is small (receives much more than it keeps), which is the normal use of a redistribution."
ran = "repro/DGR-04/redistperm.c (public API, ghost part of permgsttab filled with SCOTCH_dgraphHalo as documented in p_l.tex). Pristine INFRA/asan 32-bit: mpirun -np 2 ./redistperm_pristine32 4 0 2 -> ERROR: AddressSanitizer: memcpy-param-overlap ... #1 dgraphRedist2 dgraph_redist.c:469 #3 SCOTCH_dgraphRedist; mpirun -np 2 ./redistperm_pristine32 8 0 2 -> rank 1: rev=1 rc=0 check=1 bad-adjacency=2 ('dgraphCheck: arc data do not match'); np=3 '40 0 0' and np=4 '41 1 0' idem (check=1, bad-adjacency 1..3); controls (rev=0) and mode 1 (packs of 3) pass. The added src/check case against the pristine library (np=3, bump.grf / bump_b100000.grf): memcpy-param-overlap (ASan lib) / 'main: invalid redistributed graph (2)' (plain lib), rc=1. Patched (32-bit ASan, 64-bit, DEBUG_ALL): every combination passes; check_scotch_dgraph_redist passes on all three trees."
read_only = ""
why_not_run = ""
first_pass_critique = "Reproduction and analysis correct, and it saw that the review's second fix does not work. Its preferred diff puts a three-line conditional expression inside the memAllocGroup argument list (against his style); it did not add the regression test it itself identified as missing, and its reproducer only used the 'all vertices on rank 0' layout, so it did not establish when the corruption does not show (receiver with its own send data padding the gap), which matters for the test design."
extra_instances = []
patch_files = ["patches/G18-dgraph-fold-redist/0001-Bugfix-do-not-unpack-edge-data-in-place-when-a-user-.patch"]
cleanup_done = "none needed (the two TRICK comments on the removed lines were folded into the new size computation)"
test_added = "src/check/test_scotch_dgraph_redist.c: second redistribution of bump.grf / bump_b100000.grf (3 processes) with all vertices sent to the last process under a permutation that reverses their order (ghost part propagated with SCOTCH_dgraphHalo), checked with SCOTCH_dgraphCheck. No Makefile/CMake change needed (same executable and data)."
docs_updated = ""
group = "G18-dgraph-fold-redist"
repro = "G18-dgraph-fold-redist/DGR-04"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A: full-size destination edge area when the permutation is user-provided (recommended)"
summary = "dgraphRedist() passes a flag (srcpermgsttax != NULL) to dgraphRedist2(), which sizes the first member of the group as dstedgelocsiz * fledval words in that case (no overlap possible) and keeps the TRICK sizing for the internal, receive-ordered permutation. The final memRealloc already shrinks the block. A second case with a reversed user permutation (all vertices to the last process) is added to test_scotch_dgraph_redist.c."
diff_file = "patches/G18-dgraph-fold-redist/0001-Bugfix-do-not-unpack-edge-data-in-place-when-a-user-.patch"
tested = "redistperm matrix (np 2-4, three layouts, N 4-41, base 0/1) on 32-bit ASan and 64-bit builds; the new check case fails on pristine and passes patched; After the series: check_strat_par, check_scotch_dgraph_{check,band,coarsen,order,grow,induce,redist}, check_libparmetis_{v3,dual}, check_prog_{dgord,dgpart,dgscat-dggath,dgtst} all exit 0 on the 32-bit ASan+UBSan tree and on the 64-bit Gnum tree ($WORK/chk_32_*.log, chk_64_*.log; the only sanitizer lines are pre-existing ones in library_dgraph_coarsen.c:163 and bgraph_bipart_ml.c:195, other groups); check_scotch_dgraph_{check,coarsen,order,redist,induce} and check_prog_dgord also pass on an ASan -DSCOTCH_DEBUG_ALL tree (chk_dbg_*.log). Zero compiler warnings in the three trees. git am of the 7 patches on a fresh clone of v7.0.17 succeeds."
tradeoffs = "Peak memory of the user-permutation path grows by dstedgelocnbr * fledval words during the exchange (the internal path is unchanged). One more static-function parameter (prototype in dgraph_redist.h)."
preferred = true
maintainer_fit = "Keeps his TRICK where it is valid and documents when it is not; dgraphRedist() already branches on 'srcpermgsttax != NULL' ('Do not allocate permutation array if already provided'). Test added in the style of his 2bcd53c edit of the same test file."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "B: always allocate a full-size destination edge area (drop the TRICK)"
summary = "Size the first member as dstedgelocsiz + dstedlolocsiz words in all cases."
diff_file = "alt/G18-dgraph-fold-redist/DGR-04-B-always-full-size-edge-area.diff"
tested = "compiles (mpicc -c, 0 warnings); not run in this pass"
tradeoffs = "Three-line diff, removes a fragile invariant and makes the debug overlap asserts moot, but costs the extra peak memory on the default path too, which is exactly what the TRICK was written to avoid."
preferred = false
maintainer_fit = "He wrote the TRICK deliberately with three comments; he would keep it."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "C: detect a non-monotone receive order at run time and fall back to a separate array"
summary = "The first unpack loop records whether destination indices arrive in increasing order; if not, a separate edge array is allocated and the group block is freed after unpacking."
diff_file = "alt/G18-dgraph-fold-redist/DGR-04-C-detect-order-fallback-array.diff"
tested = "compiles (mpicc -c, 0 warnings); not run"
tradeoffs = "Optimal memory in both cases but a new allocation after the collective exchange, whose failure would need yet another agreement; two code paths to maintain."
preferred = false
maintainer_fit = "A failure point after the exchange is what his 7.0.17 reworks move away from."

