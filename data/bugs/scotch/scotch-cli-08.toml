ran = '''
export LD_LIBRARY_PATH=$WORK/build/lib (or build64/lib) ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1; cd $WORK/repro; ./build.sh $WORK/build (or build64); ./CLI-08/cli08 6 1  (6 normalised pseudo-random weights, then the same tpwgts through METIS_PartGraphKway)
pristine 32-bit: '0.185404 -> -2147483648' (all six INT_MIN), then 'ERROR: archCmpltwArchBuild2: invalid parameters (2)' and 'AddressSanitizer: attempting double-free ... #1 _SCOTCH_METIS_PartGraph2 metis_graph_part.c:313' (PS2-G25-1). 64-bit: '0.185404 -> -55411773953759104' then the same double free.
patched (0001+0002): '0.185404 -> 185404 ... 0.120656 -> 120656', 'METIS_PartGraphKway ... ret=1 objval=123', part loads within 0.1% of targets; './cli08 3 2' unchanged (19049/20266/12193). After the series, in both trees: make -C <tree>/src/check ... check_libmetis_v3 check_libmetis_v5 check_libmetis_dual_v3 check_libmetis_dual_v5 check_libmetis_dual_f_v3 check_libmetis_dual_f_v5 check_scotch_arch check_scotch_graph_map check_scotch_graph_part_ovl (gcc) and check_libparmetis_v3 (mpicc, EXECP4='mpirun --oversubscribe -np 4'): all rc=0, 0 build warnings (build.log / build64.log). The new test_libmetis.c / test_libparmetis.c compiled against the pristine $INFRA/asan libraries fail (pristine_tests/: rc=1, archCmpltwArchBuild2 'invalid parameters (2)' + double free at the bwgttab call; the Recursive NULL-ubvec call crashes).'''
read_only = ""
why_not_run = ""
first_pass_critique = "evidence right (INT_MIN values reproduced). Its tested diff clamps every weight to >= 1 (its own text says to drop that) and caps only after intGcd ((int) round (doubtmp)) with the possibly-overflowing cast, so the UB it set out to remove remains at the step that blows up; DOUBADJMAX = 1e4 is too coarse (targets below 1e-4 round to 0 and are then rejected by archCmpltw); it named the float twin but did not patch it; it did not notice the double free that its own repro printed."
patch_files = ["patches/G25-metis-graph-part/0002-Bugfix-bound-the-renormalization-factor-when-convert.patch", "patches/G25-metis-graph-part/0001-Bugfix-free-proper-array-on-invalid-target-weight-in.patch"]
cleanup_done = "none needed"
test_added = "src/check/test_libmetis.c and test_libparmetis.c: bwgttab (9 six-decimal weights summing to 1) passed as tpwgts; checkPart. Pristine: archCmpltw error + double free."
docs_updated = ""
group = "G25-metis-graph-part"
