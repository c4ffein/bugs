[[imported."pyscotch-7.0.17-review".fix_options]]
label = "a: always round at a fixed resolution (drop the common-denominator search)"
summary = "intetab[i] = round (doubtab[i] * 1e6) in both converters; intGcd no longer used there."
diff_file = "alt/G25-metis-graph-part/CLI-08-a-fixed-resolution.diff"
tested = "compiled (syntax) on pristine; not run"
tradeoffs = "Simplest and always in range, but exact ratios change (0.25/0.75 gives 250000/750000 instead of 1/3) so archCmpltw weights and partitions differ from 7.0.17 for every weighted call; the ParMETIS 'skip equal values' optimisation becomes moot."
preferred = false
maintainer_fit = "He wrote the gcd search to keep small exact integers; dropping it changes results for all existing users."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "b: bound the factor at 1e6, tested before the gcd (patch 0002)"
summary = "doubtmp = doubadj / fraction; if doubtmp <= DOUBADJMAX reduce by the gcd; if the result exceeds DOUBADJMAX, set doubadj = DOUBADJMAX and stop (fixed resolution); casts become (SCOTCH_Num). Same in the float twin (FLOTADJMAX)."
diff_file = "patches/G25-metis-graph-part/0002-Bugfix-bound-the-renormalization-factor-when-convert.patch"
tested = "cli08 6 1 / 3 2 32/64-bit, check_libmetis_v5 and check_libparmetis_v3 with a new 9-weight array without small common denominator (pristine fails on both)"
tradeoffs = "Exact small ratios preserved; arbitrary weights rounded at 1e-6 (sum of integer weights about 1e6, far below Gnum range; kgraph uses doubles for comploadavg)."
preferred = true
maintainer_fit = "Keeps his algorithm and adds a bound, as c5baef9 'Set tighter boundary on hypercube dimension' and 6a552f9 'Check overflow in intLoad()' do."

