[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "635741dd"
verdict = "incomplete"
details = '''
Right for its own report: `parser_yy.c/parser_ly.h/parser_ll.c` are now produced by the scotch target only (`src/libscotch/CMakeLists.txt:107-140`; one build.make holds the Bison rule), and `scotch.h/ptscotch.h` are safe because dummysizes/ptdummysizes list them (:52,:55) and every other owner depends on (pt)dummysizes through `DEPENDS dummysizes` (3 clean -j3 builds: one `Generate scotch.h` each).

But the same removal left two independent owners for `metis.h/metisf.h` (`libscotchmetis/CMakeLists.txt:84-85`, foreach 3 5) and `esmumps.h` (`esmumps/CMakeLists.txt:91,93,141`), against the add_custom_command rule that an output used by several targets must be driven by one custom target: `metis.h` is generated twice in 10/10 parallel runs, and `metisf.h`, which 7.0.17 serialized through metisf_h, now twice in 4/10 (new: PS3-G29-1).

Not a build failure in 20 runs here (dummysizes writes a few KB), but two writers on one file can leave a truncated header to a concurrent compiler.'''
compared_with_ours = "Our 7.0.17 commit added the missing metis_h dependency next to the existing metisf_h; that context no longer exists. Rewritten for 7.0.18: one custom target per directory (metis_h for both MeTiS headers, esmumps_h) that both libraries of each pair depend on; it keeps upstream's removal of the parser and `scotch.h` targets. Upstream's version is better for the parser and `scotch.h` (fewer targets); ours is needed for the two pairs."

