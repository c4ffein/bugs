[imported."pyscotch-7.0.18-new".upstream_fix_review]
commit = "9c51d9df85, 45a4de8591"
verdict = "unrelated"
details = '''
Neither commit touches the out-of-memory path at `graph_io.c:166-171`; 9c51d9df adds `(degrval < 0)` to the arc-count check (`graph_io.c:225-226`, relies on signed overflow: see PS3-G26-1) and 45a4de85 replaces sprintf by snprintf (proptab, 4, ...) at :140, which is exact for propval <= 111 (3 digits + NUL).

Seen from the dual-graph and esMUMPS side: METIS_MeshToDual/PartMeshDual build graphs in memory (meshGraphDual), not through graphLoad, so neither change reaches them; test_esmumps and check_libesmumps load data/bump.grf through graphLoad and are unaffected for valid files (checks pass).

The dgraph twin (`dgraph_io_load.c`) only got the snprintf part; its per-vertex degree is checked differently.'''
compared_with_ours = "our 0004 is still needed for graphLoad, graphGeomLoadChac, meshGraphDual and meshGraphNodal"

