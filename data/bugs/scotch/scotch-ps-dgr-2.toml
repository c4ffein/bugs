[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Unconditional agreement inside dgraphHaloSync2 (alt A, tested)"
summary = "Allreduce cheklocval after the memAllocGroup; free the group leader where allocated; return 1 everywhere."
diff_file = "alt/G20-dgraph-io-dmesh/PS-DGR-2-A-halosync2-allreduce.diff"
tested = "Built (pristinefi) and run: FI_NTH=4 now returns rc=1 on both ranks with no hang; labeled save np2/np3 still rc=0."
tradeoffs = "Adds one MPI_Allreduce to every halo exchange, including inside diffusion iteration loops (bdgraph_bipart_df / vdgraph_separate_df) -- a measurable hot-path cost."
preferred = false
maintainer_fit = "He guards 'cannot be merged with a useful one' agreements under SCOTCH_DEBUG_DGRAPH1 (dgraph_build.c), so an unconditional one on this hot path is against his habit."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Pre-allocate the halo scratch in the Dgraph at ghost-build time (alt B, described)"
summary = "Allocate the send/displacement/request scratch once when the ghost edge array is built (dgraphGhst already agrees on its allocation errors collectively) and reuse it; free at dgraphExit."
diff_file = ""
tested = "untested: touches dgraph.h (new field) and dgraph_ghst.c (G19) plus dgraphExit; cross-group and a small ABI/struct change."
tradeoffs = "Zero per-call overhead and no new collective, at the cost of holding the scratch for the graph lifetime."
preferred = true
maintainer_fit = "Matches his preference for agreeing allocation failures where a collective already exists (dgraphGhst), with no hot-path cost."

