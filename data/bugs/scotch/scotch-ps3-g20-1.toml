[[imported."pyscotch-7.0.18-new".fix_options]]
label = "A. Agree before each collective"
summary = "Add a local error flag and an MPI_Allreduce agreement (as dgraphBuildHcub does) before the MPI_Alltoall at (3), the Alltoallv at (4) and (6), freeing the arrays allocated so far on failure; sites (4)/(5) can use the existing velmlocnbr = -1 trick with edgelocnum = baseval and NULL-initialised hash tables. Adds up to three release-build collectives, so a maintainer decision on that idiom is needed; not done here because it is not minimal."

[[imported."pyscotch-7.0.18-new".fix_options]]
label = "B. Single up-front allocation"
summary = "Compute all array sizes that depend only on local data first, allocate them in one memAllocGroup and agree once; the sizes depending on exchanged counts (nsnddatsiz, nrcvdatsiz, hash tables) still need agreements after each exchange."

