[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A: reuse existing arrays, hoist to Init, carry the flag in the final reduction, unconditional agreement where nothing else exists (two commits)"
summary = "0007: dgraphMatchSyncColl() uses coarptr->vsndcnttab/vrcvcnttab and coargrafptr->procsndtab/procrcvtab exactly as dgraphCoarsenBuildColl() does (no allocation left). 0008: thrdtab moves into the dgraphCoarsenInit() group whose failure is already agreed upon by the thread-count reduction; the coarse-array agreement is performed in all build modes; the result of the adjacency computation (Seq or threads) rides the final dgraphAllreduceMaxSum (5 max + 1 sum) so that all processes free the coarse graph together; the edge arrays are shrunk only after that agreement."
diff_file = "patches/G21-dgraph-band-coarsen/0008-Bugfix-make-error-handling-of-dgraphCoarsenBuild-col.patch"
tested = "fault injection on every coarsening allocation, np=2 Coll, np=4 Ptop, plain/fold/folddup, base 0/1 (scans/fix2_*): rc=2 on all ranks everywhere but the halo sync; 32-bit ASan+UBSan and 64-bit Gnum trees: all 15 CHECKPTSCOTCH targets (np=3) rc=0, the dgraph test programs and dgpart/dgord/dgtst at np 1, 2, 4 rc=0, `make ptcheck` rc=0, zero sanitizer reports (chk_32/chk_64_summary.txt); -DSCOTCH_DEBUG_ALL tree: dgraph targets rc=0 (chk_dbg_summary.txt); 0 build warnings in all trees"
tradeoffs = "one int Allreduce per coarsening level added in release builds (the coarse-array agreement; the maintainer's comment says he avoided it); the final reduction grows from 5 to 6 Gnums; no new memory, five allocations per level removed"
preferred = true
maintainer_fit = "dgraphGhst()'s 'TRICK: Processes not on error will perform collective communication at end of routine' (dgraph_ghst.c:86-131) for the final reduction; dgraphCoarsenBuildColl()'s own TRICK for the arrays; the 'Set execution context as it might be needed for initialization' comment at dgraph_coarsen.c:1358 for hoisting thrdtab; the unconditional agreement follows G18/G19's commits in the combined base (dgraphRedist, dgraphBuild3), themselves after hdgraphGather()"

