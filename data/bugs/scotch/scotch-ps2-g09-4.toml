method = "source-read"
ran = "repro/PS2-kgraph-df/kdf 12 4 3 (isolated heavy vertex that gets its own part, k-way band diffusion strategy): rc=0, no hang -- the velsmsk == 0 path was not reached from the public API in this experiment."
read_only = "kgraph_map_df.c:222-231: `if (velsmsk == 0) { loopptr->abrtval = 1; goto fail; }` and the sorttab allocation failure `goto fail` jump to the `fail:` label at :528 inside the pass loop, i.e. past the barriers at :257 and :288 that the other threads execute before testing the flag at :291; the jumping thread then performs one barrier (:530) and returns, so barrier counts differ by one between threads (same class as SEP-14's `goto skip`). Also :528-534 tests the shared flag right after a single barrier, so a fast thread overflowing in the next pass can make a slow thread break one pass early (same race as bgraph_bipart_df.c:387-394)."
why_not_run = "Needs an allocation failure in a worker thread, or an anchor without edges when the band graph is split over several threads, which the band builder may never produce; file owned by G13, so no fault injection harness was built here."
location_7_0_17 = "src/libscotch/kgraph_map_df.c:222-231, :291-294, :425-431, :513-519, :528-534"
evidence = ":222-225 `if (velsmsk == 0) {                             /* If graph is too small to have any usable anchors */\\n    loopptr->abrtval = 1;                         /* We will leave during the first iteration         */\\n    goto fail;\\n  }`; :528 `fail: ;                                           /* If overflow occured, resume here */` (inside the `for (passnum ...)` loop body); :533 `if (loopptr->abrtval == 1)                    /* If all threads need to abort */`"
related_ids = ["SEP-14"]
