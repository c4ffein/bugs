verdict = "wrong"
details = '''
**Right**

names default to "-", so `dummysizes < /dev/null` and the one-argument form no longer dereference NULL; newline added to error messages.

**Wrong**

the standard-stream test was changed from `||` to `&&` (`dummysizes.c:231-232`), so any one-character file name is taken for a standard stream: `dummysizes h o < /dev/null` reads stdin, writes stdout and creates no file 'o' (verified; `lib.h out2.h` works).

Missing: the line length test still reads chartab\[CHARMAX - 1\] (`dummysizes.c:368`), so a 2046-character line is reported `line too long`; the SCOTCH_DEBUG_MAIN1 block (`dummysizes.c:408-414`) still uses .name/.pntr and does not compile (3 errors).

Header date not bumped.'''
