[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Unconditional range checks, header validation, EOF-bounded fields, velosum"
summary = "Check habvarnbr/habeltnbr/habvixnbr >= 0 and field widths >= 1 ('bad input (11)'); check every ELTPTR (bounds + non-decreasing) and VARIND value unconditionally with meshFree on error; stop field loops at EOF; set velosum = habeltnbr; drop the redundant debug check. Add data/hb3.pue -> hb3.msh conversion to check_prog_mcv."
diff_file = "patches/G11-mesh-struct-io/0007-Bugfix-validate-Harwell-Boeing-mesh-data-and-set-ele.patch"
tested = "All four repro files and the hang mutant behave as listed; check_prog_mcv (with the new hb3 lines) passes 32/64-bit; mcv on hb3.pue with the pristine library produces a mesh that mtst rejects ('invalid element vertex load sum')."
tradeoffs = "Two comparisons per value; malformed files now fail cleanly instead of corrupting memory."
preferred = true
maintainer_fit = "Mirrors G14's GRA-11 patch for graph_io_habo.c ('bad input (9)' unconditional after decoding) and his rule that user-controlled values are checked outside debug blocks."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Factor a validated fixed-width field reader"
summary = "static meshGeomLoadHaboInt (stream, width, min, max, &val) used for ELTPTR and VARIND; velosum set."
diff_file = "alt/G11-mesh-struct-io/SEP-08-b-field-reader-helper.diff"
tested = "syntax-checked only"
tradeoffs = "Smaller loops, but a static helper diverges from graph_io_habo.c's inline decoding, and the header checks are still needed."
preferred = false
maintainer_fit = "He keeps the two loaders structurally parallel; the inline form is what he patched in the graph twin."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Bound field widths to 80 characters"
summary = "Reject habcolsiz/habnzrsiz outside [1, 80] (HB lines are 80 columns), which also stops the digit-accumulation overflow for sane widths."
diff_file = "alt/G11-mesh-struct-io/PS2-6-b-bound-habo-field-width.diff"
tested = "syntax-checked only"
tradeoffs = "Could be combined with option 1; rejects nonstandard but harmless wide formats."
preferred = false
maintainer_fit = "Possible addition; not needed once the EOF test is there."

