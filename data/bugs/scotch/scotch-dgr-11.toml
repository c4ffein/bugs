[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A: range check in the local pass, hole check in the matching rounds, unconditional load check"
summary = "Local pass: vertloctax >= baseval, every end in [procvrttab[0], procvrttab[P]) ('invalid edge array'), edge loads > 0, ghost checks only under DGRAPHHASEDGEGST. Matching rounds: vertngbnnd = vertngbmin + proccnttab[procngbnum]; an end at or beyond it sets error code 4 'arc end in numbering hole'."
diff_file = "patches/G19-dgraph-build-induce/0010-Bugfix-check-edge-ends-and-edge-loads-of-distributed.patch"
tested = "repro/DGR-11 np=1-4 base 0/1; test_scotch_dgraph_check.c new cases (bump.grf base 0 and bump_b100000.grf base 100000) with -np 1-4 on 32/64/debug; relevant check targets: all CHECKPTSCOTCH targets (incl. the new check_scotch_dgraph_build) pass on the 32-bit ASan tree and the 64-bit tree (chk_32_summary.txt, chk_64_summary.txt; np=3 via the Makefile, plus the dgraph test programs, dgtst and dgpart with -np 1, 2 and 4); the dgraph targets pass on the -DSCOTCH_DEBUG_ALL tree (chk_dbg_summary.txt). The only sanitizer hits are pre-existing ones in other groups' files (library_dgraph_coarsen.c:163 memcpy with NULL, bgraph_bipart_ml.c:195 null offset), identical to G18's logs."
tradeoffs = "Stricter: graphs with non-positive edge loads, dangling ends or ends in holes are now rejected (see notes); one compare per edge in the local pass, one per matched end in the rounds (O(E) and O(E.P) already)."
preferred = true
maintainer_fit = "Follows the file's own cheklocval/goto fail structure and message style; graphCheck (sequential) already rejects out-of-range ends ('invalid edge array') so the distributed twin now matches."

[[imported."pyscotch-7.0.17-review".fix_options]]
