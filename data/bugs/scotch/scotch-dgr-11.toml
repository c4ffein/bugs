tested = "compiles; not run"
tradeoffs = "All end checks in one place and before any communication, but O(E log P) extra work and 20 more lines for what the rounds already do for free."
preferred = false
maintainer_fit = "Acceptable style, but he avoids redundant work; the rounds already enumerate every (edge, process) pair."

