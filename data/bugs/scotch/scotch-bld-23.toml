verdict = "correct"
details = '''
`gscat.c:72-74`: `-i<nbr>` now shows its mandatory argument and the text matches the code (`gscat.c:218` gives vertlocmin vertices to every part but the last, which takes the remainder; `gscat.c:186-190` rejects too large values).

The three lines are re-aligned. Header date bumped (14 oct 2026). Complete for BLD-23: the man page twin `dgscat.1.txt:96-100` and p_p.tex already documented `-inbr` before. Not touched (outside BLD-23): `dgscat.1.txt:98` still prints a literal LaTeX `\\textit{nbr}` (fixed by our 0007), and the gscat synopsis in `dgscat.1.txt:9` and p_p.tex:479 omits the mandatory <nparts> parameter (new: PS3-G28-1).

No behaviour change, no new defect.'''
compared_with_ours = "Same fix. Ours read `-i<nbr>  : Create an imbalanced distribution of <nbr> vertices per part (save for the last one)`; upstream's says `per process, remainder assigned to the last` and `potentially imbalanced` (more exact: an exact value balances), at the cost of a 117-character usage line. Ours also lived in one commit with the gmap usage fix (CLI-20). Upstream's is as good; ours is dropped for gscat."

