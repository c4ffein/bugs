[[imported."pyscotch-7.0.17-review".fix_options]]
label = "a: decide once in the top-level file"
summary = "Right after option(BUILD_LIBESMUMPS), turn it OFF with a STATUS message when USE_SUFFIX is set; src/CMakeLists.txt then tests BUILD_LIBESMUMPS alone and the config template needs no change."
diff_file = "patches/G29-cmake-sources-config/0006-Bugfix-do-not-reference-EsMUMPS-targets-in-the-CMake.patch"
tested = "Suffixed patched build + install + consumer find_package OK; unsuffixed, BUILD_LIBESMUMPS=OFF and static installs OK (repro/BLD-02/README)."
tradeoffs = "Shadows the cache option with a normal variable (standard CMake practice; the cache entry still shows ON in a GUI, the status message explains)."
preferred = true
maintainer_fit = "Keeps the existing @BUILD_LIBESMUMPS@ substitution of the template and the deliberate 'not with suffix' rule (src/CMakeLists.txt:224); one decision point, like option handling elsewhere in CMakeLists.txt (lines 84-88 set USE_SUFFIX from the suffix in the same way)."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "b: include(... OPTIONAL)"
summary = "Make the two esmumps includes of the template tolerant of missing files."
diff_file = "alt/G29-cmake-sources-config/BLD-02-b-include-optional.diff"
tested = "Applied to a copy of the pristine suffixed install: consumer configures but reports SCOTCH_LIBESMUMPS_FOUND=ON (alt/TESTS.log, repro/BLD-02/README)."
tradeoffs = "One line, but wrong information exported (LIBESMUMPS_FOUND=ON with no library) and typos in the install layout become silent."
preferred = false
maintainer_fit = "He fixes causes, not symptoms (see the 7.0.17 series: no 'ignore the error' fixes)."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "c: separate effective variable"
