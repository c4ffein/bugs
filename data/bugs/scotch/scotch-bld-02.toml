diff_file = "alt/G29-cmake-sources-config/BLD-02-c-effective-variable.diff"
tested = "Configured suffixed: generated SCOTCHConfig.cmake has if(OFF) around the esmumps includes (alt/TESTS.log)."
tradeoffs = "Works, but adds a second name for the same notion and leaves BUILD_LIBESMUMPS=ON meaning 'maybe'."
preferred = false
maintainer_fit = "Acceptable but less tidy than (a); nothing in the tree uses *_EFFECTIVE variables."

