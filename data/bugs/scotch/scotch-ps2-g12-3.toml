[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Do not split the context when deterministic behaviour is wanted (recommended)"
summary = "In kgraphMapRbPart2() and wgraphPartRb2(), read CONTEXTOPTIONNUMDETERMINISTIC and run the two sub-tasks in sequence within the same context when it is set, exactly like graphMatchInit() falls back to sequential matching."
diff_file = "patches/G12-overlap-kgraph-rb/0009-Bugfix-do-not-split-contexts-in-recursive-bipartitio.patch"
tested = "determinism runs above (1 == 2 == 4 threads once combined with G08's GG fix; overlap path already 1 == 2 == 4 with this series alone); zero warnings on 32/64-bit; check_prog_gpart, check_prog_gpart_overlap, check_scotch_graph_map on 32/64/debug builds."
tradeoffs = "Deterministic mode loses the recursion-level parallelism (each sub-task still uses all threads of the context for its own threaded methods, which are sequential in deterministic mode anyway). Non-deterministic mode unchanged."
preferred = true
maintainer_fit = "Caller-side check with the exact idiom of graph_match.c:205-225 (common_context.c cannot include context.h: the option enum is libscotch-level). 'Document that deterministic needs >= 2 threads' is not an option: the documentation already promises 'for any number of threads' and 2 and 4 threads differ as well (the split recurses)."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Always derive the second sub-task's generator, even when running sequentially"
summary = "Make contextThreadLaunchSplit() draw the second generator and run the two sub-tasks itself when the context has a single thread, so that the pseudo-random streams are identical for every thread count without losing parallelism."
diff_file = "alt/G12-overlap-kgraph-rb/PS2-G12-3-b-always-split-random-stream.diff"
tested = "untested: changes the results of every single-threaded run (COMMON_RANDOM_FIXED_SEED results change between versions), touches the common layer used by all callers, and still requires every threaded method to be thread-count independent."
tradeoffs = "Keeps parallelism in deterministic mode; larger behaviour change."
preferred = false
maintainer_fit = "A design change he may prefer for 7.1, not a 7.0.x bugfix."

