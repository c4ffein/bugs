[[imported."pyscotch-7.0.17-new".fix_options]]
label = "a. Reseed the context generator when the option is set (API, Parse, environment); SCOTCH_DETERMINISTIC env implies the fixed seed"
summary = "library_context.c: SetNum(RANDOMFIXEDSEED, 1) calls intRandSeed (randptr, 1) (the COMMON_RANDOM_FIXED_SEED seed); SetNum(DETERMINISTIC, 1) goes through SetNum(RANDOMFIXEDSEED, 1); context.c: contextOptionsInit sets rafival = 1 when deteval != 0 (as the API does) and reseeds when rafival != 0."
diff_file = "alt/G06-threads-context/PS2-G06-1-a-reseed-when-option-set.diff"
tested = "build_nofs_alt: 0 warnings; -Cf, SCOTCH_RANDOM_FIXED_SEED=1, SCOTCH_DETERMINISTIC=1 all reproducible across runs (3 trials); unconfigured runs still vary."
tradeoffs = "Behaviour change needing the maintainer's decision: (1) contextOptionsInit runs at every CONTEXTINIT, i.e. at every library call on a plain (non-container) object, so with the option on the shared global generator is reseeded before every call and successive calls on the same graph give identical results, whereas with the compile-time flag the stream continues across calls (SCOTCH_randomReset exists for users who want the restart); (2) reseeding the global generator from one context affects all contexts that use it."
preferred = true
maintainer_fit = "Smallest change that makes the documented knobs do what README.md:115 and s_l.tex:7913 say; whether the run-time option should mean 'seed once per process' (which needs intRandInit to know the option, i.e. moving the random initialization from contextInit() to contextCommit() and giving intRandInit a flag) is his call. Not sent as a commit for that reason."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "b. Honour the option at first generator initialization only"
summary = "Move intRandInit() of the global generator from contextInit() to the first contextCommit()/contextRandomClone() and pass it the option value (seed 1 if fixed, time(NULL) otherwise), so the semantics equal the compile-time flag."
diff_file = ""
tested = "untested: no diff; needs an API change of intRandInit() (common layer) and a change of the init order in context.h CONTEXTINIT and SCOTCH_contextInit; the maintainer's design choice."
tradeoffs = "Exact equivalence with COMMON_RANDOM_FIXED_SEED; but the option value is only known after contextOptionsInit, and the option set later through SCOTCH_contextOptionSetNum would have no effect on an already-initialized generator unless it reseeds (option a)."
preferred = false
maintainer_fit = "Cleaner semantics, larger change across common_integer.c / common_context.c / context.h."

