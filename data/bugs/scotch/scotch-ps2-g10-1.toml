[[imported."pyscotch-7.0.17-new".fix_options]]
label = "UINT words (committed)"
summary = "Declare the bit array as UINT, whose width is INTSIZEBITS by definition (common.h:274,277), and shift (UINT) 1."
diff_file = "patches/G10-mesh-separators/0001-Bugfix-size-element-bit-array-of-meshInduceSepa-acco.patch"
tested = "mord/sep02 on 32x32 and 64x64 meshes, 32- and 64-bit builds; check_prog_mmk/gmk_msh/mord/mesh_order on both."
tradeoffs = "None; 32-bit builds unchanged."
preferred = true
maintainer_fit = "Minimal and consistent with common.h's own `(UINT) 1 << (INTSIZEBITS - 1)`; same shape as his 6a00c51 bit-set fixes."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Keep unsigned int, index with its own width"
summary = "Replace INTSIZEBITS by (sizeof (unsigned int) << 3) as library_dgraph_map_stat.c:189,432 does."
diff_file = "alt/G10-mesh-separators/PS2-G10-1-b-unsigned-int-width.diff"
tested = "compiled only (tools/altcheck.sh)"
tradeoffs = "Longer expressions repeated three times; same result."
preferred = false
maintainer_fit = "He used that idiom once in library_dgraph_map_stat.c, but here the INTSIZEBITS macro is already in place, so changing the word type is the smaller diff."

