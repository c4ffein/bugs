[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A: make Ptop mirror Coll (NULL guard, free only the group leader)"
summary = "procvgbtab = NULL; fold (vnumgsttax == NULL) into the allocation test; free only procvgbtab on error. The index array belongs to the caller, as the Coll variant and all four callers already assume."
diff_file = "patches/G21-dgraph-band-coarsen/0001-Bugfix-do-not-free-the-index-array-of-the-caller-in-.patch"
tested = "fault injection np=4 Ptop and np=2 Coll, base 0 and 1, band / grow / internal dgraphBand (scans/fix1_*); 32-bit ASan+UBSan and 64-bit Gnum trees: all 15 CHECKPTSCOTCH targets (np=3) rc=0, the dgraph test programs and dgpart/dgord/dgtst at np 1, 2, 4 rc=0, `make ptcheck` rc=0, zero sanitizer reports (chk_32/chk_64_summary.txt); -DSCOTCH_DEBUG_ALL tree: dgraph targets rc=0 (chk_dbg_summary.txt); 0 build warnings in all trees"
tradeoffs = "none: internal routines, no ABI or behaviour change on success"
preferred = true
maintainer_fit = "it is the maintainer's own Coll code (dgraph_band_grow.c:131-162) applied to its twin; he mutualized the two variants in this very file ('mutualized between dgraphBand and dgraphGrow', header notes)"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "B: callee owns the index array"
summary = "both variants free vnumgsttax + baseval on error, the three callers stop freeing it, SCOTCH_dgraphGrow() works on an internal copy of the user array"
diff_file = "alt/G21-dgraph-band-coarsen/DGR-07-B-callee-frees.diff"
tested = "untested: sketch only (applies to the base tree)"
tradeoffs = "inverts the ownership convention of four call sites, costs a vertgstnbr-Gnum copy per SCOTCH_dgraphGrow() call, and a NULL partgsttab is no longer handled gracefully"
preferred = false
maintainer_fit = "no precedent: every dgraph routine that receives a user array (dgraphHaloSync, SCOTCH_dgraphGrow, SCOTCH_dgraphBand frontier) leaves it to the caller"

