needs = ""
needs_note = ""
location = "src/libscotch/dgraph_band_grow.c:369-401 (Ptop: no vnumgsttax == NULL guard at l.369, memFree (vnumgsttax) at l.398); callers dgraph_band.c:164-168, library_dgraph_band.c:150-155, library_dgraph_grow.c:129-132"
evidence = "dgraph_band_grow.c:394-401 (Ptop): `if (reduglbtab[0] != 0) {\\n    if (vnumgsttax != NULL) {\\n      if (procvgbtab != NULL)\\n        memFree (procvgbtab);                     /* Free group leader */\\n      memFree (vnumgsttax);\\n    }\\n    return (1);\\n  }` versus Coll l.131-132 `procvgbtab = NULL; /* In case of error */\\n  if ((vnumgsttax == NULL) ||` and l.158-162 which free only procvgbtab. Caller dgraph_band.c:166-167 `if (bandvnumgsttax != NULL)\\n      memFree (bandvnumgsttax + grafptr->baseval);` frees the same array again; library_dgraph_grow.c:129 `bandpartgsttax = (partgsttab != NULL) ? (Gnum *) partgsttab - grafdat.baseval : NULL;` passes the user's array."
upstream_change = "1c6d977 / 7e1b5af (3 oct 2026) touch dgraph_band_grow.c for style and a memSet length only; the defect is unchanged"
review_accuracy = "accurate; it does not say that with a non-zero base the freed pointer is not even a malloc'ed address (invalid free rather than double free), nor that the missing NULL guard is a NULL store in the Ptop variant only when the caller's allocation failed"
notes = "Patch 0002 (PS2-G21-1) is needed on top of 0001 for the failing process not to hang the others in release builds; before it, the Ptop fix alone turns the crash into a hang."
severity = "medium"
severity_note = "same as the review: reachable from the public SCOTCH_dgraphGrow() (user array freed) and from every bipartitioning/separation band strategy, but only after an allocation failure"
ran = '''
LD_PRELOAD fault shim (repro/common), v7.0.17 UBSan tree, np=4 'sparse' topology (point-to-point selected):
$WORK/repro/common/scan.sh $WORK/pristinefi/lib ./bin_pristinefi/g21fi 4 1 3 4 -- band sparse 1 4 2
  nth=3 exit=139 :: (1): ERROR: SCOTCH_dgraphBand: out of memory (1); dgraph_band_grow.c:439:3: runtime error: store to null pointer of type 'Gnum'
  nth=4 exit=134 :: (1): ERROR: dgraphBand2Ptop: out of memory (1); fishim: rank 1: signal 6 (free(): invalid pointer)
$WORK/repro/common/scan.sh ... 4 1 3 3 -- grow sparse 1 4 3
  nth=3 exit=134 :: (1): ERROR: dgraphGrow2Ptop: out of memory (1); signal 6 (the user's partgsttab was freed; the driver's own free() aborts)
Patched: same commands on $WORK/buildfi -> nth=3,4: rank 0..3: band rc=1 / grow rc=1, no sanitizer output (scans/fix1_band_sparse_b1.txt, fix1_grow_sparse_b1.txt).'''
read_only = ""
why_not_run = ""
first_pass_critique = "Status, location, reproducer and preferred option are right. Its tradeoff note ('other ranks still hang because in non-debug builds the Ptop error is not propagated') is correct and is the defect I fixed separately (PS2-G21-1); the first pass filed it under 'DGR-13 class' and left it. Its option 2 (callee owns the array) was not implemented; it is alt/DGR-07-B."
patch_files = ["patches/G21-dgraph-band-coarsen/0001-Bugfix-do-not-free-the-index-array-of-the-caller-in-.patch", "patches/G21-dgraph-band-coarsen/0002-Bugfix-make-error-handling-of-dgraphBand2Coll-and-dg.patch"]
cleanup_done = "none needed (patch 0002 removes the #ifdef'd reduglbtab[1] declaration made useless by the unconditional agreement)"
