verdict = "correct"
details = '''
GRAPHPARTOVLVIEW (`library_graph_map_view_f.c:108-137`): all four name variants exported (nm: SCOTCHFGRAPHPARTOVLVIEW, scotchfgraphpartovlview, \_, \_\_), argument order (grafdat, partnbr, parttab, fildes, ierr) = C order + ierr, matches the new s_l.tex synopsis; partnbr passed by address and dereferenced; dup/fdopen/fclose pattern copied from GRAPHMAPVIEW with error paths closing filenum.

Verified functionally: `repro/PS3-G17-1/views.c` prints the same 63 bytes through the wrapper as through the C routine, ierr=0, 32/64-bit. `library_f.h/scotchf.h` only define kinds and constants (no routine declarations), so nothing to add there.

**Minor**

grafptr and parttab lose their const in the wrapper (harmless). Incomplete as a sweep: the same file still lacks twins for SCOTCH_graphMapViewRaw, SCOTCH_graphRemapView and SCOTCH_graphRemapViewRaw, and SCOTCH_graphMapViewRaw is not even declared in `library.h` (PS3-G17-1, patches 0006/0007); the 13 documented-but-missing wrappers of API-24 remain.'''
compared_with_ours = "Our 7.0.17 series did not add graphpartovlview (it was undocumented then; our audit listed it among `C routines with no Fortran wrapper`). Ours adds the 13 documented ones (0001, 0004)."

