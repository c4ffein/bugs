diff_file = "patches/G10-mesh-separators/0002-Bugfix-read-node-loads-from-the-node-load-array-in-m.patch"
tested = "repro/SEP-02 on both builds; test_scotch_mesh_order (3 grid variants) on both builds, 30 repeated runs; check_prog_mord/mesh_graph."
tradeoffs = "None on file meshes (shared array); correct weights now used for SCOTCH_meshBuild meshes, so their orderings change."
preferred = true
maintainer_fit = "The Mesh header documents vnlotax as the node load array and hmesh_order_nd.c already feeds m.vnlosum to vnhlsum; his hmesh_induce.c:180,245 use vnlotax for nodes."

