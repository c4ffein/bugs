diff_file = "patches/G19-dgraph-build-induce/0006-Bugfix-translate-the-vertex-labels-of-non-compact-ed.patch"
tested = "repro/DGR-12 (np 1-4, base 0/1), new test_scotch_dgraph_build.c with -np 1-4 on 32/64/debug trees; relevant check targets: all CHECKPTSCOTCH targets (incl. the new check_scotch_dgraph_build) pass on the 32-bit ASan tree and the 64-bit tree (chk_32_summary.txt, chk_64_summary.txt; np=3 via the Makefile, plus the dgraph test programs, dgtst and dgpart with -np 1, 2 and 4); the dgraph targets pass on the -DSCOTCH_DEBUG_ALL tree (chk_dbg_summary.txt). The only sanitizer hits are pre-existing ones in other groups' files (library_dgraph_coarsen.c:163 memcpy with NULL, bgraph_bipart_ml.c:195 null offset), identical to G18's logs."
tradeoffs = "Graphs that used to be accepted with unknown labels or a wrong edgelocnbr now fail with a message (intended); one extra O(E) scan."
preferred = true
maintainer_fit = "Same error-at-the-site + agreement structure as his hdgraphGather rework (0635547); the message style matches 'duplicate vertex label (1)'."

