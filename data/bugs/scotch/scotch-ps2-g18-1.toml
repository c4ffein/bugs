[[imported."pyscotch-7.0.17-new".fix_options]]
label = "A: check the realloc result into a temporary and fail through fail2 (hdgraphExit frees the still-valid original block)"
summary = "if ((indedgeloctax = memRealloc (...)) == NULL) { errorPrint (\"hdgraphInduceList: out of memory (4)\"); goto fail2; } indgrafptr->s.edgeloctax = indedgeloctax - baseval; (reuses the existing local indedgeloctax, dead at that point). Same change wanted in dgraph_induce.c:239,244 (other group's file)."
diff_file = "alt/G18-dgraph-fold-redist/PS2-G18-1-A-check-realloc-result.diff"
tested = "applies to v7.0.17 (git apply --check), compiles with 0 warnings in 32-bit and 64-bit flags; not run (file outside this group's patch scope, not included in the series)"
tradeoffs = "The failure happens after the halo exchange and before dgraphBuild4 (collective), so with release-only agreements the other processes still enter dgraphBuild4 alone: the same class as PS-DGR-4, to be solved in hdgraphInduceList with its own agreement (the induce group)."
preferred = true
maintainer_fit = "His own debug-mode guard of the same shrink in dgraphRedist2 ('Shrinking should never fail'); the maintainer may prefer a SCOTCH_DEBUG_HDGRAPH2-only check since a shrinking realloc does not fail with glibc."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "B: debug-only check, as in dgraphRedist2"
summary = "Same test under #ifdef SCOTCH_DEBUG_HDGRAPH2 with 'internal error' wording."
diff_file = ""
tested = "untested: design only"
tradeoffs = "Release builds keep dereferencing NULL if a shrink ever fails (custom allocators, memory-limited environments)."
preferred = false
maintainer_fit = "Matches dgraph_redist.c:476-481 exactly."

