id = "COR-01"
area = "COR"
our_title = "PARAMVAL error action dereferences parser context cleared by the nested-strategy mid-rule"
claimed_severity = "high"
status = "still-present"
method = "ran"
needs = ""
needs_note = ""
location = "src/libscotch/parser_yy.y:458-464 (mid-rule clears context), :482-488 (error action), bison state 78 (after '=') is where error is shifted"
evidence = "parser_yy.y:460-463: '($<SAVE>$).strat = penvptr->straptr; ($<SAVE>$).param = penvptr->paraptr; penvptr->straptr = NULL; penvptr->paraptr = NULL;'  parser_yy.y:484-486: 'errorPrint (\"stratParserParse: invalid value for parameter \\\"%s\\\" of method \\\"%s\\\", ...\", penvptr->paraptr->nameptr, penvptr->straptr->tablptr->methtab[penvptr->straptr->data.methdat.methnum].nameptr, ...'. Mechanism (bison --report): a syntax error inside the sub-strategy pops the stack back to state 78 (the only state that shifts `error`), discarding the $<SAVE>$ mid-rule value without restoring it; the error action then runs with NULL (or stale inner) context."
upstream_change = ""
review_accuracy = "accurate on crash, location and reproducer. Its 'Fix' (guard NULL or restore from saved state) is only half right: a NULL guard loses the parameter name, and the saved state cannot be restored by the final action because bison has already discarded it; the restore must happen when the value is discarded (destructor) or the error rule must move inside the sub-strategy alternative. The context can also be non-NULL but stale (inner method with outer parameter), which a NULL guard does not catch."
notes = "The last_resort generated parser files are NOT regenerated in this series: the maintainer does it himself in a separate commit at release time (38cbde4 'Update last_resort parser files for v7.0.17'), and his flex emits #line numbers one lower than the local flex 2.6.4 (identical otherwise), so a regeneration here would not be byte-identical to his. See SUMMARY.md."
severity = "high"
severity_note = "Crash from any user-supplied strategy string with a typo inside a nested parameter (CLI -M/-O, PyScotch strings); agrees with the review."
ran = "LD_LIBRARY_PATH=$INFRA/asan/lib repro/common/st_pristine 'r{sep=m{asc=b{:width=3}}}' -> 'ERROR: stratParserParse: invalid strategy string, line 1, column 15, at \":width=3}}}\"' / 'parser_yy.y:485:45: runtime error: member access within null pointer of type const struct StratParamTab' / 'AddressSanitizer: SEGV ... #0 _SCOTCHyyparse parser_yy.y:485 #1 stratParserParse parser_yy.y:819 #2 stratInit parser.c:112 #3 SCOTCH_stratGraphMap'. Variants: 'r{sep=m{asc=(b{width=3}|' -> SEGV at 485:72 (straptr NULL); 'r{sep=m{asc=b{bnd=f,org=f},low=h{:}}}' -> SEGV (paraptr NULL). Patched: 'invalid value for parameter \"asc\" of method \"m\", line 1, column 13, before \"b{:width=3}}}\"', ret=1, no sanitizer output. Mutation fuzz (repro/common/fuzz.py, 4 default strategies x 600 mutations, seed 1): pristine 2072/2400 sanitizer hits, patched 0/2400 (and 0/2400 with seed 2). check_strat_seq, check_strat_par (mpirun), check_scotch_graph_map, check_scotch_graph_order pass on the 32-bit ASan tree after the series (graph_map shows 2 pre-existing UBSan 'offset to null pointer' reports in bgraph_bipart_ml.c:195/kgraph_map_ml.c:239, identical on pristine); check_strat_seq passes on the 64-bit tree; every commit of the series compiles its touched files with zero warnings (bison/flex/gcc -Wall, 32-bit flags); git am of the series on a fresh clone gives an identical tree."
read_only = ""
why_not_run = ""
first_pass_critique = "Status/evidence right. Preferred option A (NULL guard + generic message) is not what the maintainer would want: it prints a different, parameter-less message for the nested case and still lets a stale non-NULL context print a misleading 'parameter X of method Y' (e.g. 'r{sep=(m{asc=b}m{:})}' prints asc of m); it also leaves the leaks of the discarded context untouched. Option B (stack in ParserEnv) is more state than needed. The claim 'd555f2c shows the idiom is a local NULL guard' is a stretch: d555f2c removed a call to a non-existent routine."
patch_files = ["patches/G04-strategy-parser/0002-Bugfix-restore-parser-context-before-reporting-a-syn.patch", "patches/G04-strategy-parser/0010-Add-strategy-string-checks-to-test_strat_seq.patch"]
cleanup_done = "none needed (the $<SAVE>$ casts become typed $$/$1; nothing left unused)"
test_added = "src/check/test_strat_seq.c: stratbadtab[0] 'r{sep=m{asc=b{:width=3}}}' must be rejected (crashes on pristine)"
docs_updated = ""
