repro = "G04-strategy-parser/COR-01"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A. Typed <SAVE> mid-rule value with a %destructor that restores the context (recommended)"
summary = "Give the mid-rule value a type (bison >= 3.1 typed mid-rule, CMake already requires 3.8.2) and declare '%destructor { penvptr->straptr = ($$).strat; penvptr->paraptr = ($$).param; } <SAVE>', so that whenever bison discards the sub-strategy context during error recovery or abort, the enclosing method and parameter are restored and the existing error rule prints the right names. Grammar and error rule unchanged, no conflict."
diff_file = "patches/G04-strategy-parser/0002-Bugfix-restore-parser-context-before-reporting-a-syn.patch"
tested = "Built (0 warnings, 0 conflicts) 32/64-bit; all crash strings above now print the correct parameter/method; Mutation fuzz (repro/common/fuzz.py, 4 default strategies x 600 mutations, seed 1): pristine 2072/2400 sanitizer hits, patched 0/2400 (and 0/2400 with seed 2). check targets pass; test_strat_seq regression case added."
tradeoffs = "Relies on bison calling destructors for popped symbols (documented since bison 1.875) and on typed mid-rule actions (bison 3.1+; the project's CMake requires 3.8.2 and last_resort files are generated by 3.8.2). Side-effecting destructor must be understood by readers (comment added). No behaviour change on valid input; messages for scalar typos unchanged."
preferred = true
maintainer_fit = "Smallest coherent fix that keeps his single error rule and message; the same %destructor mechanism is what COR-23 needs (commit 3), so the three defects share one design: 'every discarded parser value has a destructor'. Precedent for minimal targeted grammar/lexer fixes: e1700d7 (COR-12), a94688c (COR-25)."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "B. New PARAMSTRAT nonterminal with its own error alternative, context restored before YYERROR"
summary = "'PARAMVAL: $@ PARAMSTRAT {restore; if ($2 == NULL) YYERROR; store}', 'PARAMSTRAT: STRATSELECT | error { $$ = NULL; }'. The error is caught in the state after the mid-rule, where the saved value is still on the stack."
diff_file = "alt/G04-strategy-parser/COR-01-b-paramstrat-error-rule.diff"
tested = "Built and run: all crash strings print the right parameter; BUT bison reports 1 shift/reduce conflict on token error in state 78 (PARAMVAL: error vs. reduce of the mid-rule), because both error rules are reachable there. Removing 'PARAMVAL: error' avoids the conflict but makes the scalar-typo message depend on bison default reductions and needs a second errorPrint site."
tradeoffs = "Plain yacc, no destructor; but either a grammar conflict or a duplicated message and reliance on default reductions."
preferred = false
maintainer_fit = "He does not ship grammars with conflicts; rejected."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "C. NULL-guard the error action and print a generic message (first pass / review)"
summary = "Test penvptr->paraptr/straptr for NULL and print 'invalid value for strategy parameter, line, column' when cleared."
diff_file = "alt/G04-strategy-parser/COR-01-c-firstpass-null-guard-and-COR-22-check.diff"
tested = "Not re-run by me (first pass reports 0/2264 crashes with it); by construction it still prints misleading names when the context is stale but non-NULL ('r{sep=(m{asc=b}m{:})}')."
tradeoffs = "Three lines, but two different messages for the same error class, loses the parameter name exactly when the user needs it (nested strategies), and does not address the discarded context being wrong rather than NULL."
preferred = false
maintainer_fit = "He would take a guard for a pure NULL case, but here the root cause is a discarded value; the guard hides it."

