[[imported."pyscotch-7.0.17-new".fix_options]]
label = "A. Build the sorted domain array from mapped vertices only; sentinel so that unmapped ends never count as neighbors (patch)"
summary = "Skip -1 vertices when filling domntab (give them pidx ~0), sort/iterate only the mapped ones, and set nghbtab[0] = ~0 so that an unmapped end vertex always matches the sentinel in the neighbor search."
diff_file = "patches/G16-library-seq-api/0003-Bugfix-do-not-account-for-unmapped-vertices-in-SCOTC.patch"
tested = "gmtst partial/full/one-vertex maps (repro/PS2-G16-1/README), test_scotch_graph_map_view 0 and 1, all check targets listed in SUMMARY.md, 32- and 64-bit."
tradeoffs = "Statistics of partial mappings change from all-zero to meaningful; full mappings unchanged (verified on the shipped check data with one thread)."
preferred = true
maintainer_fit = "Mirrors what SCOTCH_dgraphMapStat already does for unmapped vertices (its '-1' cell and 'nmskloctab[0] &= ~1'), keeps the existing TRICK sentinel style (library_graph_map_view.c:306 'TRICK: avoid testing (i+1)')."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "B. Same filtering, explicit test instead of the sentinel trick"
