[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "52dcf6026c"
verdict = "incomplete"
details = '''
**Right**

both call sites (:141, :153) now go through the mask lookup, and threadProcessCoreNum() uses threadProcessCoreNbr() so the non-Linux build reduces the same way. Breaks: the documented coretab value -1 (`thread not bound`, s_l.tex:8224-8226) reaches threadProcessCoreNum(); `-1 % corenbr` stays -1, the loop `for (corenum = 0; thrdnum >= 0; ...)` (:930) is not entered and corenum = 0 is returned, so the thread is bound to CPU 0 even outside the process mask (run: taskset 2-3 → CPU 0).

Any negative entry does the same. The block comment (:912-916) still speaks of a `thread number`. The routine's first-pass sketch in our 7.0.17 critique predicted exactly this bug.'''
compared_with_ours = "Our 0004 had the same call sites plus `if (corelog < 0) return (-1);`, a renamed parameter (corelog) and a rewritten block comment. The rebased 0003 adds only the guard and the comment, keeping upstream's parameter name. Ours was better (no regression); upstream's keeps the non-Linux reduction in one place, which ours did not."

