[[imported."pyscotch-7.0.17-review".fix_options]]
label = "B. Logical core numbers mapped through the process mask, -1 preserved (recommended)"
summary = "threadProcessCoreNum() takes a logical core number (returns -1 for negative input, modulus-reduces, walks the saved mask); threadContextInit() calls it for both automatic and explicit placement: 'corenum = threadProcessCoreNum (contptr, (coretab != NULL) ? coretab[thrdnum] : thrdnum);'."
diff_file = "patches/G06-threads-context/0004-Bugfix-map-explicit-core-numbers-through-the-process.patch"
tested = "repro/COR-24 under taskset on both trees (threads stay in the mask, -1 unbound); check_scotch_context (uses an explicit coretab {0, n-1, ..., 1}) at 1/2/4 threads on both trees."
tradeoffs = "Behaviour change only for processes whose mask does not start at CPU 0 or has holes (there the old code was wrong); identical on unrestricted machines. Without COMMON_PTHREAD_AFFINITY_LINUX threads are never bound, unchanged."
preferred = true
maintainer_fit = "Makes the code match his own documentation and INSTALL.txt (threads are placed 'within the run-time thread binding'); one lookup routine for both placements, as the comment at :152 ('slaves use saved main thread mask') already assumes."

