tested = "32/64-bit builds 0 warnings; repro/SEP-23/base all checks 0; check_mesh_base passes on both builds and fails on the pristine library with the same global-buffer-overflow."
tradeoffs = "No behaviour change for callers (none exist). Test uses internal headers like test_common_thread.c."
preferred = true
maintainer_fit = "graphBase() (graph_base.c:95-100) shifts velotax/vnumtax/vlbltax/edlotax; hmeshCheck() (hmesh_check.c:92) uses the plain `vehdtax != m.vendtax` alias test the patch reuses."

