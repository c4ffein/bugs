[[imported."pyscotch-7.0.17-new".fix_options]]
label = "Shift the label array to the node range"
summary = "Pass `vlbltax + (vnodbas - baseval)` (NULL stays NULL) in the three SCOTCH_meshOrderSave* routines."
diff_file = "alt/G11-mesh-struct-io/PS2-1-a-mesh-order-save-labels.diff"
tested = "syntax-checked only (file not in this group; not in the series)"
tradeoffs = "Nodes-first meshes have vnodbas == baseval so the offset is 0 there; elements-first meshes get the right labels."
preferred = true
maintainer_fit = "One-line, same shape as the CONTEXTOBJECT edits he made in this file in 6a030db."

[[imported."pyscotch-7.0.17-new".fix_options]]
