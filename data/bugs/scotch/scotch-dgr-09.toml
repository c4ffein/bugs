notes = "De-duplication judged against the tree: SCOTCH_dgraphBand() builds a different graph (no anchors, vertex labels, no part/frontier outputs) and has been a separate copy since 6.0; a shared static helper has no precedent in libscotch, so both copies were fixed identically in one commit (Refs: DGR-09, API-17)."
severity = "medium"
severity_note = "as the review: internal routine reached by every band strategy (bdgraphBipartBd, vdgraphSeparateBd), only after an allocation failure; the base-1 wrong-base free hits every process, not only the failing one"
ran = '''
Internal dgraphBand() under the fault shim, np=2 path graph, failure on rank 1 (v7.0.17 UBSan + pattern-init tree):
$WORK/repro/common/scan.sh $WORK/pristinefi/lib ./bin_pristinefi/g21fi 2 1 0 7 -- bandint path 0 8 2
  nth=2 exit=139 :: (1): ERROR: dgraphBand: out of memory (2); dgraph_band.c:224:32: runtime error: store to null pointer of type 'Gnum'
  nth=3 exit=139 :: (1): ERROR: dgraphBand: out of memory (3); fishim: rank 1: signal 11 (free of the never-allocated, pattern-filled bandfronloctab)
  nth=4 exit=1   :: out of memory (4); signal 11 on rank 1 (same)
$WORK/repro/common/scan.sh ... 2 1 0 7 -- bandint path 1 8 2   (base 1)
  nth=3..6 :: signal 6/11 on BOTH ranks (memFree (bandvnumgsttax + bandgrafptr->baseval) after dgraphFree() reset baseval; rank 0 does the same on the error flag it receives)
Patched: same commands on $WORK/buildfi -> nth=0..6: rank 0,1: bandint rc=1, no sanitizer output; nth=7 HANG in dgraphHaloSync2 (G20).'''
read_only = "the 64-bit overflow of the scratch array (procglbnbr GNUM_MPI values into MAX (vertgstnbr * sizeof (Gnum), procglbnbr * sizeof (int)) bytes) is read from the sizes; with 32-bit Gnum both sizes coincide and the UBSan fault-injection tree is 32-bit"
why_not_run = ""
first_pass_critique = "Right status, evidence and reproduction (including the 64-bit overflow on a real 64-bit tree). Its preferred option 1 is the minimal local patch (alt/DGR-09-B): it leaves the leaks on the later error paths, keeps the comma-chained allocation ladder that the maintainer removed from dgraphInduce2() in 3c9b3ab, and keeps 'if (bandfronloctab != NULL)' guards instead of a single cleanup path. It also writes 'MAX (vertgstnbr, procglbnbr) * sizeof (Gnum)' which I kept."
patch_files = ["patches/G21-dgraph-band-coarsen/0005-Bugfix-fix-out-of-memory-handling-of-dgraphBand-and-.patch", "patches/G21-dgraph-band-coarsen/0011-Style-fix.patch"]
cleanup_done = "removes the now-unused `cheklocval` local of both routines and the two now-redundant end-of-routine assignments `bandgrafptr->edgeloctax = bandedgeloctax; bandgrafptr->edloloctax = bandedloloctax;`; fixes the two one-space-indented lines (l.157,159); patch 0011 fixes a pre-existing comment spacing in library_dgraph_band.c"
test_added = "\"\" : no fault-injection home in src/check; check_scotch_dgraph_band covers the success path at np=1,2,3,4 on 32/64-bit and debug"
