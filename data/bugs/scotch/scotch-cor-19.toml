commit = "29c96822e0"
verdict = "incomplete"
details = '''
Adds the c5baef9 upper bound to SCOTCH_archHcub() (`library_arch.c:350`), so `archHcub(70)` is now rejected. Missing:

1. no lower bound: SCOTCH_archHcub(-1) → `arch_hcub.c:261:13: runtime error: shift exponent -1 is negative`, size=-2147483648, and SCOTCH_archHcub(0) is accepted while archHcubArchLoad() rejects `hcub 0`
2. the int shifts (`arch_hcub.c:158,242,261,380`) remain, so 64-bit trees accept dimensions 31..62 and compute garbage: asan64 `hcub 40` → `shift exponent 40 is too large for 32-bit type int`, size=256; `hcub 31` → size=-2147483648.'''
compared_with_ours = "Our 7.0.17 0003 moved the bound into a shared archHcubArchBuild(); since upstream put it inline, the rebased 0006 drops archHcubArchBuild() and only adds `(dimnnbr < 1) ||` to upstream's test, plus the Anum shifts and the generator bounds (unchanged)."

