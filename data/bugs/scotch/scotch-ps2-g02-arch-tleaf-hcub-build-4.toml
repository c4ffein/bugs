tested = "applies to v7.0.17; not compiled separately (one cast)"
tradeoffs = "The allocation then simply fails; every other 'n * sizeof' in the tree has the same theoretical size_t wrap for n near ANUMMAX."
preferred = true
maintainer_fit = "G01's file; one-token change in the maintainer's style."

[[imported."pyscotch-7.0.17-new".fix_options]]
