[imported."pyscotch-7.0.18-new".upstream_fix_review]
commit = "9c51d9df85"
verdict = "incomplete"
details = "It rejects a negative running arc count after `degrval += edgenum`. That addition is itself the overflow (signed, undefined behavior; UBSan reports it on hugedeg.grf); the test works only because GCC wraps in practice. A negative degree is still accepted whenever the running count stays non-negative (negdeg.grf loads; the arcs of the vertex silently disappear and graphLoad returns success). Twins: `dgraph_io_load.c` degree reads and meshLoad (G11 0010) not touched."
compared_with_ours = "Ours rejects degrval < 0 at read time and tests `degrval > (edgennd - edgenum)` before adding, which is overflow-free; upstream's commit is subsumed. Rebased 0005 replaces upstream's test by ours."

