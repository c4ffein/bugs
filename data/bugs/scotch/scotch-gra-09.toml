diff_file = "alt/G14-graph-loaders/GRA-09-b-record-dimension-only.diff"
tested = "untested: alternative not built."
tradeoffs = "Smallest change, never reallocs caller memory, but cannot reuse a Geom across dimensions."
preferred = false
maintainer_fit = "Acceptable but less flexible than reallocating."

