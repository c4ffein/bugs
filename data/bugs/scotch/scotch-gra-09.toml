[[imported."pyscotch-7.0.17-review".fix_options]]
label = "(Re)allocate geomtab and record the dimension (recommended)"
summary = "memRealloc geomtab to vertnbr*dimnnbr and set geomptr->dimnnbr."
diff_file = "patches/G14-graph-loaders/0006-Bugfix-store-geometry-dimension-in-Scotch-geometry-l.patch"
tested = "Built 32/64-bit (0 warnings); gra09 reports dim=2 and saves all coordinates; no leak (memRealloc reuses the existing block)."
tradeoffs = "Reallocates every call (negligible); assumes geomtab came from memAlloc, which holds for geomInit users."
preferred = true
maintainer_fit = "memRealloc(NULL,...) idiom is used across the tree; fixes both the missing dimension and the stale-size reuse in one place."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Record the dimension only; refuse a differing reuse"
