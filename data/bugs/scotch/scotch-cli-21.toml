id = "CLI-21"
area = "CLI"
our_title = "PT-Scotch tools return without MPI_Finalize on help/version; errorPrint never aborts the job"
claimed_severity = "low"
status = "still-present"
method = "partly-run"
needs = "mpi-fault"
needs_note = "the hang needs a launcher that does not kill the job when a rank exits non-zero; not available (Open MPI 5 only)"
location = "src/scotch/dgmap.c:176-179, 253-256, 303-307; dgord.c:154-156, 221-223, 253-255; dgscat.c:119-121, 148-150, 162-164; dggath.c:121-123, 150-152, 165-167; dgtst.c:134-136, 162-164, 176-178; src/libscotch/library_error_exit.c:142"
evidence = "dgmap.c:176-179 'if ((argc >= 2) && (argv[1][0] == '?')) {       /* If need for help */\\n    usagePrint (stdout, C_usageList);\\n    return     (EXIT_SUCCESS);\\n  }' after MPI_Init at :165-169; the only MPI_Finalize is at :491. library_error_exit.c:142 'exit (EXIT_FAILURE);' after the SCOTCH_PTSCOTCH rank prefix at :120-126; git grep MPI_Abort -- src finds nothing."
upstream_change = ""
review_accuracy = "first half accurate and reproduced; the 'others can hang' claim is launcher dependent (not reproducible with Open MPI/PRRTE, which kills the job); its Fix line is what the series does"
notes = "Patch 0004 is a design decision for the maintainer: MPI_Abort of MPI_COMM_WORLD from a library. I recommend it because the error-exit libraries are documented as 'exit immediately' and, for an MPI job, exit() of one process is undefined by the standard while MPI_Abort is the defined way; it is a separate commit."
severity = "low"
severity_note = "help/version exits only produce a spurious launcher error (rc 1); the error path hangs only with launchers that do not kill the job, hence low as in the review"
ran = "mpirun --oversubscribe -np 2 dgmap -h (and -V, '?', dgord/dgscat/dggath/dgtst -h): usage printed by every rank, then 'prterun has exited due to process rank 1 ... exited without calling \"finalize\"', rc=1; patched: rc=0 for all 15 paths. Hang test: m16x16.grf scattered on 3 ranks, part-1.grf truncated; timeout 15 mpirun -np 3 dgtst 'part-%r.grf' -> 'dgtst(1): ERROR: dgraphLoadDist: bad input (1)', job killed by prterun, rc=1 in < 1 s (same with dgord); patched with 0004: 'MPI_ABORT was invoked on rank 1 in communicator MPI_COMM_WORLD, Errorcode: 1', rc=1, 1 s."
read_only = "the hang itself: Open MPI 5 / PRRTE kills the job on a non-zero exit, so the other ranks never hang here; a launcher that keeps the job alive (Slurm srun without KillOnBadExit, some batch systems) is needed to see it"
why_not_run = ""
first_pass_critique = "Right on both halves and honest about not reproducing the hang. It left MPI_Abort as a non-preferred sketch: the PT variant of the error-exit library already calls MPI_Initialized to print the rank, so it is MPI-aware by design and the abort belongs there (the sketch also lacked the MPI_Finalized guard, needed because MPI_Initialized stays true after MPI_Finalize). It did not note that usage is printed once per rank."
extra_instances = []
patch_files = ["patches/G28-tools-docs-tests/0003-Bugfix-finalize-MPI-before-the-PT-Scotch-programs-ex.patch", "patches/G28-tools-docs-tests/0004-Abort-the-MPI-job-when-errorPrint-of-the-PT-Scotch-e.patch"]
cleanup_done = "none needed"
test_added = "; no natural home: the check Makefile has no test of program exit statuses on help paths, and the hang needs a launcher that keeps the job alive"
docs_updated = "doc/src/handson/h_c.tex (libptscotcherrexit now 'aborts the whole MPI job')"
group = "G28-tools-docs-tests"
repro = "G28-tools-docs-tests/CLI-21"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "a. MPI_Finalize before the three early returns of the five tools"
summary = "15 sites, two lines each."
diff_file = "patches/G28-tools-docs-tests/0003-Bugfix-finalize-MPI-before-the-PT-Scotch-programs-ex.patch"
tested = "rc 0 for dgmap -h/-V/?, dgord/dgscat/dggath/dgtst -h with -np 2; make ptcheck 32/64"
tradeoffs = "none"
preferred = true
maintainer_fit = "the final return of main already does MPI_Finalize(); return (EXIT_SUCCESS): this makes the early exits identical"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "b. MPI_Abort in the PT-Scotch error-exit library"
summary = "libptscotcherrexit's errorPrint calls MPI_Abort (MPI_COMM_WORLD, EXIT_FAILURE) when MPI is initialized and not finalized, then exit; the hands-on guide sentence updated."
diff_file = "patches/G28-tools-docs-tests/0004-Abort-the-MPI-job-when-errorPrint-of-the-PT-Scotch-e.patch"
tested = "bad part file on rank 1, -np 3: MPI_ABORT banner, rc 1 in 1 s; make ptcheck 32/64 (the dg* program tests link it)"
tradeoffs = "behaviour change for embedders linking libptscotcherrexit: the whole job dies instead of one process (which is what an exit-on-error library means for an MPI job); Open MPI prints its MPI_ABORT banner"
preferred = true
maintainer_fit = "the PT variant exists only to be MPI-aware (rank prefix at :120-126); he kept it a separate library precisely so that exit semantics can differ; kept as its own commit so it can be dropped alone"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "c. Print usage/version on process 0 only, and finalize"
summary = "Same as a, plus 'if (proclocnum == 0)' around the prints, so that -np 8 does not print 8 copies."
diff_file = "alt/G28-tools-docs-tests/CLI-21-c-usage-on-root-process-only.diff"
tested = "compiles (mpicc, 0 warnings); not run"
tradeoffs = "nicer output but changes what users see on the other ranks' streams; the '?' path runs before the rank is used elsewhere so it is safe"
preferred = false
maintainer_fit = "cosmetic, no precedent in the tree; he can take it later if wanted"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "d. MPI_Abort only under a compile flag"
summary = "#ifdef SCOTCH_ERROR_ABORT around the abort, default off."
diff_file = "alt/G28-tools-docs-tests/CLI-21-d-abort-under-compile-flag.diff"
tested = "compiles with -DSCOTCH_PTSCOTCH -DSCOTCH_ERROR_ABORT; not run"
tradeoffs = "keeps the old behaviour by default, so the hang stays for everyone who does not know the flag"
preferred = false
maintainer_fit = "he has SCOTCH_ERROR_SLEEP as precedent for such flags, but an opt-in does not fix the reported problem"

