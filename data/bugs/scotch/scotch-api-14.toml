[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "a09f32492d"
verdict = "incomplete"
details = '''
**Correct**

vertnbr → vertnnd bound (`library_graph_map_view.c:129,133`), first component now starts at distance 0, and the -1 return of graphMapView3 is now tested with memFree(domntab) and return (1) (lines 541-546), which is complete since domntab is the group leader.

**Wrong**

`connval = distmax ++` (line 136) post-increments distmax before the BFS, so distmax is a floor of connval + 1: a single-vertex component reports 1 instead of 0 (every part of a one-vertex-per-part mapping, small1/m11x13 prints `PartDiam min=1 max=1`), and the chaining of disconnected components is inconsistent (component of diameter 0 adds 1, of diameter d>=1 adds d, with no gap between components). 32/64-bit identical.'''
compared_with_ours = "Ours (7.0.17 0001) started distmax at -1 and kept `connval = ++ distmax`, giving 0 for singletons and chaining components as if joined by one edge; it also documented the return values of graphMapView3. Upstream's error-path check is equivalent to ours (upstream adds an errorPrint, slightly better). Ours is better on the arithmetic; the rebased 0001 keeps upstream's error path and only changes the two distmax lines plus the header comment."

