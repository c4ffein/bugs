[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "18911e4f61"
verdict = "wrong"
details = '''
**Right**

levlnbr < 1 now rejected by archTleafArchLoad() (`arch_tleaf.c:115-116`) and SCOTCH_archTleaf() (`library_arch.c:552-555`) (`tleaf 0`, `sub 1 0 tleaf 0` now `bad input (1)`, no report); sizes/links validated in SCOTCH_archTleaf(); ltleaf duplicate and level-boundary checks no longer debug-only; SCOTCH_archLtleaf() checks index range and duplicates.

**Wrong**

1. the new memFree (archptr->sizetab) on `bad input (2)` and `invalid architecture size` (`arch_tleaf.c:135,143`) and on the ltleaf `fail:` label (`arch_tleaf.c:699-700`) leave the freed pointer in the body, and archLoad() then calls archTleafArchFree() (`arch_tleaf.c:172`) which frees it again: `tleaf 2 4 1 x` → `AddressSanitizer: attempting double-free ... #1 _SCOTCHarchTleafArchFree arch_tleaf.c:172 #2 _SCOTCHarchLoad arch.c:216; freed by _SCOTCHarchTleafArchLoad arch_tleaf.c:135` (clean in 7.0.17), same for `ltleaf 2 4 1 2 1 8 0 1 2 3 4 5 6 x` (freed at `arch_tleaf.c:700`)
2. the overflow test `(archsiz * sizetab[levlnum]) < archsiz` (`arch_tleaf.c:141`, `library_arch.c:581`) computes the signed product it guards (UBSan `signed integer overflow`) and misses wraps to a larger value: `tleaf 2 100000 1 50000 1` loads with size=705032704 on 32-bit
3. SCOTCH_archTleaf()/SCOTCH_archLtleaf() free their arrays on error but leave them, and the class, in the Arch, so the caller's SCOTCH_archExit() frees them again: archbuild 0 (perm {5,0}) and 1 (duplicate) → `attempting double-free ... archTleafArchFree arch_tleaf.c:174; freed by SCOTCH_archLtleaf library_arch.c:630`, archbuild 4 (sizes {0,-3}) → heap-use-after-free
4. the now-unconditional level-boundary loop (`arch_tleaf.c:708-714`) multiplies by sizetab\[levlnum\] after decrementing and before testing levlnum < 0, reading sizetab\[-1\]: `ltleaf 1 4 1 3 2 1 0` → `heap-buffer-overflow ... _SCOTCHarchLtleafArchLoad arch_tleaf.c:709`
5. SCOTCH_archLtleaf() still accepts permnbr < 1 and permutation sizes that do not match a level boundary (archbuild 2: permnbr 3 on size 4 → r=0).'''
compared_with_ours = "Our 7.0.17 0002 moved every check into new archTleafArchBuild()/archLtleafArchBuild() routines shared by loaders and builders (327 lines), with ANUMMAX-division overflow checks and fields published on success. Upstream chose inline checks in each loader/builder instead; ours had none of the five defects above, upstream's avoided a refactor. Rebased series keeps upstream's inline structure and fixes only the defects (0002-0005), which is smaller and fits upstream's choice; our test addition (ltleaf in `test_scotch_arch.c`) is not carried, as it would conflict with G01's ARCHNBR change (see SUMMARY)."

