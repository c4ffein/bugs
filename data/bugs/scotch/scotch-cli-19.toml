[[imported."pyscotch-7.0.17-review".fix_options]]
label = "b: dispatch on OBJTYPE in the common V5 routine (patch 0005)"
summary = "objtval = _SCOTCH_METIS_optionGet (options, xadj, METIS_OPTION_OBJTYPE, METIS_OBJTYPE_CUT); CUT -> _SCOTCH_METIS_PartGraph (adjwgt, vsize ignored); VOL -> _SCOTCH_METIS_PartGraph_Volume (vsize, NULL = unit sizes, which it already supports); other values -> METIS_ERROR_INPUT."
diff_file = "patches/G25-metis-graph-part/0005-Bugfix-select-the-partitioning-objective-from-option.patch"
tested = "cli19 (six cases), check_libmetis_v5 32/64-bit with new checkObjval() cases (VOL without vsize, CUT with vsize) which the pristine code fails"
tradeoffs = "Behaviour change for callers that relied on 'vsize given => volume' without setting OBJTYPE (they must set it, as with METIS); doc sentence for OBJTYPE updated."
preferred = true
maintainer_fit = "Same dispatch as his PartMeshDual (metis_graph_part_dual.c:217-219) and the documented meaning of OBJTYPE in s_l.tex."

