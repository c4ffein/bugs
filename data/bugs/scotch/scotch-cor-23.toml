[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A. %destructor for <STRAT> and <TEST>; <SAVE> destructor frees the discarded in-progress method node (recommended)"
summary = "Ownership invariant: typed stack values own completed sub-trees (destructors stratExit/stratTestExit); penvptr->straptr owns the method node being built; the <SAVE> chain owns enclosing ones; the <SAVE> destructor frees the inner node before restoring the outer; stratParserParse frees whatever is left (in-progress node or completed tree after STRAT reduced). Manual frees before YYABORT stay; the debug internal-error path gets its missing stratExit ($2)."
diff_file = "patches/G04-strategy-parser/0003-Bugfix-free-partially-built-strategy-trees-on-parsin.patch"
tested = "Built 32/64-bit, 0 warnings; every leak string above is clean under LeakSanitizer; Mutation fuzz (repro/common/fuzz.py, 4 default strategies x 600 mutations, seed 1): pristine 2072/2400 sanitizer hits, patched 0/2400 (and 0/2400 with seed 2). valid strategies and all check targets unchanged."
tradeoffs = "Depends on bison destructor semantics for popped symbols and abort cleanup (documented, stable). STRAT (start symbol) stays untyped on purpose: bison destroys the start symbol on accept."
preferred = true
maintainer_fit = "Standard bison practice, few lines, keeps his explicit frees; coherent with commit 2's destructor."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "B. Own the method node on the stack via a typed STRATMETHOD mid-rule value; stratParserParse no longer frees"
summary = "'STRATMETHOD : METHODNAME <STRAT>{ ... ($$) = straptr; }' so bison frees the in-progress node; remove the free in stratParserParse to avoid a double free."
diff_file = "alt/G04-strategy-parser/COR-23-b-typed-method-midrule-owns-node.diff"
tested = "Built and run: fixes the nested leaks but LEAKS the whole tree when the error comes after a complete strategy ('r{...}:' -> 624 bytes) because the STRAT rule has already handed the tree to penvdat.straptr, which is no longer freed; also bison -Wother 'unused value: $2'. Rejected."
tradeoffs = "Cannot distinguish 'in-progress node on the stack' from 'completed tree in penvdat' at stratParserParse time."
preferred = false
maintainer_fit = "No."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "C. Free only the observed sites (first pass option C)"
summary = "Add explicit frees in the specific YYABORT paths that drop nodes."
diff_file = ""
tested = "untested: never complete, the discarded-by-recovery values are not reachable from actions."
tradeoffs = "Cannot fix values popped by bison itself."
