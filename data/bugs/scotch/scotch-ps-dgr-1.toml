[[imported."pyscotch-7.0.17-new".fix_options]]
label = "A: init matching data only on success; one cleanup in dgraphCoarsen() after the agreement"
summary = "`if (cheklocval == 0) cheklocval = dgraphMatchInit (...)`; dgraphCoarsenInit() no longer calls dgraphCoarsenExit() itself; on error, dgraphMatchExit() only if the matching data exists, then dgraphCoarsenExit(); the Allreduce failure falls into the same cleanup"
diff_file = "patches/G21-dgraph-band-coarsen/0006-Bugfix-do-not-initialize-matching-data-after-a-faile.patch"
tested = "injection nth=3..6 (all four Init allocations and the MatchInit one): rc=2 on all ranks; 32-bit ASan+UBSan and 64-bit Gnum trees: all 15 CHECKPTSCOTCH targets (np=3) rc=0, the dgraph test programs and dgpart/dgord/dgtst at np 1, 2, 4 rc=0, `make ptcheck` rc=0, zero sanitizer reports (chk_32/chk_64_summary.txt); -DSCOTCH_DEBUG_ALL tree: dgraph targets rc=0 (chk_dbg_summary.txt); 0 build warnings in all trees"
tradeoffs = "none"
preferred = true
maintainer_fit = "the 'TRICK: negative value on error' agreement already exists; he routes cleanup through one place after the agreement in 3c9b3ab and in G19's dgraphGhst2()"

[[imported."pyscotch-7.0.17-new".fix_options]]
