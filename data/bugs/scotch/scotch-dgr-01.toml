[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A: collective allocation gate before edge data is sent, unconditional first agreement, one cleanup label (recommended)"
summary = "Senders post only edge-count and vertex messages; pure receivers post their count/vertex receives, wait for the counts and allocate the edge array; then all processes agree (MPI_Allreduce MAX on orggrafptr->proccomm). On failure every pending communication is matched, so one MPI_Waitall over the whole (MPI_REQUEST_NULL-prefilled) request array drains them before buffers are freed. The first agreement (fail1) is always performed and also covers graph compaction and the debug parameter checks. All error paths share one cleanup label that frees the folding data, the communication array, the compacted arrays, the folded data array and the folded graph. The debug-only agreements before dgraphCheck and at the end are kept as designed (nothing but MPI calls can fail after the gate: dgraphBuild4 does not allocate). Same restructuring in hdgraphFold2()."
diff_file = "patches/G18-dgraph-fold-redist/0003-Bugfix-make-error-handling-of-dgraphFold2-and-hdgrap.patch"
tested = "Fault injection on every allocation of dgraphFold2 (receiver and sender, base 0/1, np=3,4) and of hdgraphFold2 (through dgraphOrderCompute): all processes return 1, no hang, no sanitizer report. After the series: check_strat_par, check_scotch_dgraph_{check,band,coarsen,order,grow,induce,redist}, check_libparmetis_{v3,dual}, check_prog_{dgord,dgpart,dgscat-dggath,dgtst} all exit 0 on the 32-bit ASan+UBSan tree and on the 64-bit Gnum tree ($WORK/chk_32_*.log, chk_64_*.log; the only sanitizer lines are pre-existing ones in library_dgraph_coarsen.c:163 and bgraph_bipart_ml.c:195, other groups); check_scotch_dgraph_{check,coarsen,order,redist,induce} and check_prog_dgord also pass on an ASan -DSCOTCH_DEBUG_ALL tree (chk_dbg_*.log). Zero compiler warnings in the three trees. git am of the 7 patches on a fresh clone of v7.0.17 succeeds."
tradeoffs = "Two small MPI_Allreduce per fold in release builds (one before posting, one before edge data), against a data exchange of half the graph: negligible. Reverses the maintainer's explicit choice to compile the first agreement out ('cannot be merged with a useful one'); there is no existing collective to piggyback on in release builds. Function grows by ~30 lines; six fail labels instead of four. MPI call failures (fatal by default) remain unrecoverable, as before."
preferred = true
maintainer_fit = "Uses his 7.0.17 idiom exactly: 'cheklocval = 1; /* Assume an error */', goto failN, 'cheklocval = 0; /* Everything went well */' before the agreement label, a label inside the failure block that later code jumps back to (dgraphInduce2, 3c9b3ab: fail1 inside the memAllocGroup failure block), unconditional MPI_Allreduce at the fail label (hdgraphGather, 0635547)."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "B: receiver-side cleanup only (drain own requests, free leaks), first agreement unconditional, no gate"
summary = "At fail3 the receiver waits for its own posted requests, frees the folding data and the compacted arrays, then fails; the first agreement is made unconditional."
diff_file = "alt/G18-dgraph-fold-redist/DGR-01-B-receiver-side-drain-only.diff"
tested = "compiles (mpicc -c, 0 warnings); not run: by construction the senders' edge-data Isends stay unmatched"
tradeoffs = "Fixes the use-after-free and the leaks of the receiver only; senders of edge data to the failed receiver still block forever in their final MPI_Waitall (large messages) and the other receivers return 0. Smallest diff."
preferred = false
maintainer_fit = "Leaves the hang the review reports; he would not take a partial fix."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "C: over-allocate the receiver edge array before the first agreement, no second gate"
summary = "Pure receivers allocate their edge array with an upper bound (remote edges, or received vertices times degrglbmax, plus local edges) before fail1, so that nothing but MPI calls can fail after the single agreement; the array is shrunk with memRealloc once the counts are known."
diff_file = "alt/G18-dgraph-fold-redist/DGR-01-C-overallocate-no-gate.diff"
tested = "compiles (mpicc -c, 0 warnings); not run"
tradeoffs = "One agreement instead of two, but the bound min(edgeglbnbr - edgelocnbr, vertrcvnbr * degrglbmax) can be much larger than the exact size (star-like graphs), which defeats the purpose of folding small graphs; relies on the shrinking memRealloc never failing."
preferred = false
maintainer_fit = "He sized this array exactly on purpose (edge counts are exchanged first); extra peak memory in the fold is what the design avoids."

