[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "ff9d5a54"
verdict = "correct"
details = '''
Correct on both INT sizes: the pre-multiplication bound (INTVALMAX+9)/10 is exact (no value that fits is rejected, intgval\*10+9 cannot wrap the UINT), and the post-addition test rejects INTVALMAX+1..INTVALMAX+9; fuzz 0/900000 mismatches per size; the COMMON_DEBUG-only check that missed upward wraps is gone. Failure returns 0 like a syntax error, which every caller already tests (!= 1, sums, 1 - intLoad); the destination is untouched on error. Behaviour changes:

1. an error message `intLoad: overflow` is now printed in release builds (fine)
2. `-INTVALMAX-1` (e.g. -2147483648) is now rejected, while 7.0.17 release builds accepted it by signed-overflow luck; harmless since Scotch never writes that value. Style nit: a doubled space in `charval  = getc (stream);` after the '-' sign (`common_integer.c:95`). No test added. No measurable cost.'''
compared_with_ours = "Our 7.0.17 commit did the same check with signed arithmetic (`val > (INTVALMAX - car) / 10`), equivalent in results; upstream's unsigned form is as good. Ours also added `src/check/test_common_integer.c` and its Makefile/CMake rules: rebased as a test-only commit 'Add test for integer loading routine `intLoad()`' (passes on 7.0.18). Neither covers the fscanf/atol twins (see extra_instances; graphTabLoad patched as PS3-G07-1)."

