[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A. Check before accumulating, unconditionally (the review's fix line)"
summary = "car -= '0'; if (val > ((INTVALMAX - car) / 10)) { errorPrint (\"intLoad: overflow\"); return (0); } val = val * 10 + car; — one subtraction, one division by a constant and one compare per digit, no undefined behaviour; removes the COMMON_DEBUG blocks; value untouched on error, like syntax errors; adds test_common_integer."
diff_file = "alt/G07-common-misc/COR-15-A-check-before-accumulate.diff"
tested = "archload on 4 targets and 300000-string fuzz on 32-bit and 64-bit builds; check_common_integer, check_scotch_arch(_deco), check_prog_gbase/gtst/gpart/gord/gmap, check_scotch_graph_map/order, check_strat_seq pass; -O3 timing within noise."
tradeoffs = "Rejects the single value -INTVALMAX-1 (accepted before only through the wrap); one more error line ('intLoad: overflow') before the loader's own message."
preferred = true
maintainer_fit = "He already chose the message and the return-0 semantics in 6a552f9; making a user-input check unconditional is his rule (STYLE: 'an unconditional check for anything a user file controls'); the cost argument is settled by measurement."

