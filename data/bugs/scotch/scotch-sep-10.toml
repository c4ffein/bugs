[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Free-vertex loads only, in both routines, convention documented (recommended)"
summary = "bgraphZero(): compload0 = velosum, compload0dlt = velosum - compload0avg (as bgraphInit2); bgraphSwal(): complement with velosum instead of velosum + vfixload[0] + vfixload[1]; bgraph.h field comments state that compload0avg/compload0/compsize0 exclude fixed vertices. The checker already enforces exactly this (bgraph_check.c:104 and :182), so no checker change is needed."
diff_file = "patches/G09-bgraph-df-ga-fm/0005-Bugfix-do-not-account-for-fixed-vertex-loads-in-bgra.patch"
tested = "Debug-build runs above; check_scotch_graph_map, check_prog_gpart, check_prog_gmap, check_scotch_graph_order, check_scotch_context, check_scotch_graph_part_ovl, check_prog_gpart_overlap, check_prog_gpart_remap, check_scotch_graph_coarsen all pass with 0 sanitizer reports on the 32-bit and the 64-bit ASan+UBSan builds of the full series (logs $WORK/check_build*_*.log); check_prog_gpart, check_prog_gmap, check_scotch_context and check_scotch_graph_map also pass on a -DSCOTCH_DEBUG_ALL build"
tradeoffs = "Behaviour change only when vfixload[0] != 0 (fixed-vertex mapping), where the imbalance after a zeroing becomes right."
preferred = true
maintainer_fit = "bgraphInit2(), bgraphCost(), bgraphBipartDf():520, bgraphBipartFm():291-298 and kgraph_map_rb_part.c:264 all use velosum for the free part and add the fixed loads only when computing tolerances; the one convention the tree supports."

