[[imported."pyscotch-7.0.17-new".fix_options]]
label = "b. Guard the two ordering callers like G12's 0009 guards the two partitioning callers (recommended; extends 0009)"
summary = "hgraph_order_nd.c and hmesh_order_nd.c: include context.h, read CONTEXTOPTIONNUMDETERMINISTIC, run the two sub-tasks in sequence when set ('if ((deteval != 0) || (contextThreadLaunchSplit (...) != 0))'), identical to 0009's hunks."
diff_file = "alt/G06-threads-context/PS2-G08-2-b-order-callers-no-split.diff"
tested = "build_alt_b: gord bump.grf identical at 1, 2 and 4 threads under SCOTCH_DETERMINISTIC=1 (0 differing lines); builds with 0 warnings; applies on v7.0.17 (and on top of 0009, different files)."
tradeoffs = "Loses task-level concurrency of nested dissection under the deterministic option (each half still uses all threads for its own threaded work, as graphMatchInit() does); four near-identical guards in the tree."
preferred = true
maintainer_fit = "The maintainer's idiom for consuming the option is in the algorithm that needs it, with '#include \"context.h\"' (graph_match.c:57,205-212; dgraph_band_grow.c:403; dgraph_match_sync_ptop.c:222): no common_*.c file includes context.h, the common layer only provides the values mechanism and does not know what value 0 means. Caller-side guards also leave dgraphFoldDup()'s split alone, which consumes no random numbers and would be serialized for nothing by option a."

[[imported."pyscotch-7.0.17-new".fix_options]]
label = "a. Refuse to split in contextThreadLaunchSplit() when the deterministic option is set (single point, all five callers)"
summary = "common_context.c: include context.h, read the option, 'return (1)' ('could not split') so every caller takes its sequential fallback; routine comment updated."
diff_file = "alt/G06-threads-context/PS2-G08-2-a-common-context-no-split.diff"
tested = "build_alt_a: gord identical at 1, 2, 4 threads; gpart 2 == 4 threads (1-thread residual = SEP-13); 0 warnings; applies on v7.0.17."
tradeoffs = "One place instead of five, cannot be forgotten by a future caller; but it makes the common layer depend on libscotch's option numbering (layering) and serializes the PT-Scotch fold-dup split (dgraph_fold_dup.c:166) although it is random-free; makes 0009's guards redundant."
preferred = false
maintainer_fit = "Layering: common_context.c is the generic context code; the deterministic option is a libscotch concept (context.h, contextOptionsInit in context.c)."

