commit = "0536da0977"
verdict = "correct"
details = "Guards the copy and the free with multlocptr != NULL, which covers both the sender case (size 0) and the `ratio not met` return 1 (vertlocnbr already set, array never created). Verified by running both cases. Minor difference: the SCOTCH_DEBUG_LIBRARY2 size check above (l.153-161) still runs when no folded array exists; it compares the advised bound with coargrafptr->vertlocnbr, which on the `ratio not met` path holds the unfolded multinode count; dgraphCoarsenVertLocMax() bounds that in every normal distribution, so this is not a defect worth a commit (not run: no LIBRARY2 build)."
compared_with_ours = "Ours (7.0.17 0010) tested multlocptr in the outer condition, so it also skipped the debug size check; upstream's is the smaller change and is enough. Ours is dropped (after upstream's commit it would only add a redundant test)."

