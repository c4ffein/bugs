location = "src/libscotch/wgraph_part_rb.c:355-368 (empty-part branch, call at :363), :297-304 (terminal-domain branch taken when spltnum == 0), :330-331 (dwgttab from inddomnsiz / 2)"
evidence = '''
wgraph_part_rb.c:355-363:
  if ((partval = 1, actgrafdat.compsize[0] <= 0) || /* If a subpart is empty, run on other part ... */
      (partval = 0, actgrafdat.compsize[1] <= 0)) {
    spltdat.splttab[1].vertnbr = actgrafdat.s.vertnbr; /* TRICK: use fake part 1 for calling */
    ...
    spltdat.parttax = NULL;
    wgraphPartRb2 (contptr, partval, &spltdat);
wgraph_part_rb.c:297-300: if (indpartval == 0) { if (inddomnsiz <= 1) { wgraphPartRb3Fron (dataptr, orggrafptr, orgfrontab, orgfronnbr); wgraphPartRb3One (dataptr, orggrafptr, orgparttax, indpartval, inddomnnum); -- orgfrontab and orgparttax are NULL here.
Second defect in the same branch: when partval == 0 and inddomnsiz == 3, the surviving part owns a single domain (splttab[0].domnsiz == 1); calling the recursion on it (with any spltnum) bipartitions the graph again with dwgttab = {inddomnsiz / 2, ...} = {0, 1} (:330-331) and wgraphPartRb3Both (:341) then maps part 1 onto inddomnnum + 1, which belongs to the sibling.'''
upstream_change = "813ef60 (08 oct 2026) only changed the type of indvertnbr in this file (int -> Gnum); the empty-part branch is untouched."
review_accuracy = "Accurate on the crash mechanism (spltnum = partval = 0, NULL parttax, uninitialised splttab[0].vertnbr). Its 'Fix:' line (call with 1) is incomplete: it stops the crash but leaves the terminal-domain case wrong (shown above with r{sep=(z|f)}). Making Rb3* return errors through revaptr is unnecessary: their only failure paths are debug-only parameter checks that cannot trigger once the call is right."
notes = "The Rb3* helpers still return void with debug-only checks; acceptable since the only invalid call is removed. Commit 0007."
severity = "high"
severity_note = "Public API (SCOTCH_graphPartOvl) crash in release builds; needs a bipartition that leaves a part empty, which happens on small (sub)graphs with real strategies and always with 'z'. Same rating as the review."
ran = '''
Build: INFRA/asan (pristine 7.0.17, ASan+UBSan, 32-bit Gnum) vs $WORK/build (same flags, this series); LD_LIBRARY_PATH=<tree>/lib, UBSAN_OPTIONS=print_stacktrace=1, ASAN_OPTIONS=detect_leaks=0 unless stated. Reproducers and exact commands in $WORK/repro/<ID>/README.
$WORK/repro/SEP-01/partovl.32 6 3 'r{sep=z}' (pristine):
  wgraph_part_rb.c:108:5: runtime error: null pointer passed as argument 2 ... #0 wgraphPartRb3Fron #1 wgraphPartRb2 wgraph_part_rb.c:299 #2 wgraphPartRb2 wgraph_part_rb.c:363
  wgraph_part_rb.c:207:18: runtime error: load of null pointer of type 'const GraphPart' ; AddressSanitizer: SEGV in wgraphPartRb3One
Same for 7/8/9 vertices x 3 parts with 'z'; 4 and 5 parts return 'ret=0 part: 0 0 0 0 0 0' (spltnum 0 with domnsiz >= 2 survives by luck). Patched: 6 3 'r{sep=z}' -> ret=0 part: 0 0 0 0 0 0; matrix of n=6..9, p=3..5, strategies z/f/h/g/default all ret=0, no sanitizer report.
One-token alternative (alt/SEP-01-a) built by symbol interposition against the pristine library: ./partovl_sep01a 6 3 'r{sep=(z|f)}' -> ret=0 part: 1 1 1 1 1 1 (every vertex in part 1 although the surviving fake part only owns domain 0); recommended fix -> 0 0 0 0 0 0.
New check line `test_scotch_graph_part_ovl 3 data/m16x16.grf /dev/null 'r{sep=z}'`: pristine library -> runtime error + SEGV (rc 141); patched -> passes.'''
read_only = ""
why_not_run = ""
first_pass_critique = "Status, method and reproducer right; the preferred option (one-token fix) was tested only with strategies for which the degenerate child bipartition happens to put everything in part 0, so the wrong-domain case was missed; option 2 (guard in callee) has the same hole and leaves the recursion bipartitioning a graph onto a single domain. The 'maintainer precedent' claimed (wgraphPartRb starts with fake part 1) supports calling with 1 but not the missing terminal case."
patch_files = ["patches/G12-overlap-kgraph-rb/0007-Bugfix-handle-empty-part-after-bipartitioning-in-wgr.patch"]
cleanup_done = "none needed"
test_added = "src/check/Makefile and src/check/CMakeLists.txt: test_scotch_graph_part_ovl 3 data/m16x16.grf /dev/null 'r{sep=z}' (checks the empty-part path; crashes on pristine)."
docs_updated = ""
group = "G12-overlap-kgraph-rb"
repro = "G12-overlap-kgraph-rb/SEP-01"

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Recurse on fake part 1 and map directly onto a terminal domain (recommended)"
summary = "In the empty-part branch: if the surviving part owns a single domain, put all vertices (separator included) in part 0 with vgraphZero() and map them with wgraphPartRb3One(); otherwise call wgraphPartRb2 (contptr, 1, &spltdat) as the TRICK comment intends."
diff_file = "patches/G12-overlap-kgraph-rb/0007-Bugfix-handle-empty-part-after-bipartitioning-in-wgr.patch"
tested = "repro matrix above (32-bit and 64-bit patched builds), check_scotch_graph_part_ovl (+ new line), check_prog_gpart_overlap, SCOTCH_DEBUG_ALL build runs wgraphCheck() after it: clean."
tradeoffs = "No behaviour change when no part is empty. Reuses existing helpers; vgraphZero() costs one memset of the part array."
preferred = true
maintainer_fit = "Mirrors the kgraph twin: kgraphMapRbPart2 handles the empty part by recursing on the same subgraph with the surviving subdomain (kgraph_map_rb_part.c:290-302) and kgraphMapRbPart3 maps a whole graph onto a terminal domain (:133-156). Same 'TRICK' reuse style as the surrounding code."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "One-token fix: always recurse on fake part 1"
summary = "wgraphPartRb2 (contptr, 1, &spltdat) only (first pass's option)."
diff_file = "alt/G12-overlap-kgraph-rb/SEP-01-a-fake-part-only.diff"
tested = "interposed into the pristine library: no crash on the matrix, but 'r{sep=(z|f)}' on 2..8 vertices x 3/7 parts maps every vertex onto the sibling's domain (part 1 1 1 ...)."
tradeoffs = "Stops the crash; still bipartitions a graph onto a single domain with dwgttab {0,1} and may assign vertices outside the target range."
preferred = false
maintainer_fit = "Too small: leaves a silent wrong result."

[[imported."pyscotch-7.0.17-review".fix_options]]
label = "Guard the terminal branch in the callee"
summary = "Make the small-branch test `(indpartval == 0) && (orgparttax != NULL)` so a NULL part array means whole graph."
diff_file = "alt/G12-overlap-kgraph-rb/SEP-01-b-callee-guard.diff"
tested = "untested: same hole as option 2 (whole graph still bipartitioned onto one domain), rejected by reading."
tradeoffs = "Relies on parttax == NULL as a flag; does not fix the terminal case."
preferred = false
maintainer_fit = "Not what the code's own comment intends."

