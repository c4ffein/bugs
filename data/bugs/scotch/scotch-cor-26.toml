[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "13e4dee6"
verdict = "incomplete"
details = '''
**Right**

zero divisor rejected for both integer (`parser.c:433-437`) and double (:426-430) modulus, with o=1 propagated to the caller, which reports `error in mapping strategy`; making the double case an error too (it was NaN, silently false) is a reasonable choice.

Missing: INTVALMIN % -1 overflows and traps (SIGFPE) on x86 (ran, 32 and 64 bit); integer literal range (`parser_ll.l:137`/141/153) untouched. Behaviour change: the double modulus by zero, previously silently false, now aborts the strategy (acceptable, documented nowhere).

Messages `(1)`/`(2)` follow upstream's usual numbering.'''
compared_with_ours = "Our 7.0.17 commit 0006 had the zero check (integer only) plus the -1 guard; upstream's adds the double check, ours had the -1 guard. Rebased: our commit shrinks to the -1 guard only (new subject `do not trap when evaluating a modulus by -1`); our literal-range commit 0007 applies unchanged."

