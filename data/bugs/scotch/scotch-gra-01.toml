[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "22c9c42e87"
verdict = "wrong"
details = '''
**Right**

kgraphMapRbVfloBuild no longer creates slots for zero-load fixed vertices (`kgraph_map_rb.c:271-274`) and its table is sized from dfixmax = min(vfixnbr, archsize) computed once in kgraphMapRb (:150-160), which bounds its entries; the int shift `1 << (hashsiz + 2)` is gone from both routines; the unused archptr parameter of VfloBuild is dropped.

**Wrong**

kgraphMapRbVfloMerge (:413-415) is now sized from dfixmax ONLY, but it first inserts every domain of the mapping computed on the free vertices (:423-436, mappptr->domnnbr entries, up to the number of parts). 7.0.17 sized it from domnnbr + vflonbr.

With fewer than ~domnnbr/4 distinct fixed terminals the table (minimum 8 slots) fills up and the probe loop has no exit: SCOTCH_graphMapFixed/graphPartFixed with 1 fixed vertex and >= 9 parts hangs (default strategy, through kgraphMapMl → kgraphMapRb), 32/64-bit.

The shipped tests only fix 4-12 vertices on small architectures, so they miss it.

**Minor**

`fariable-sized` typo in the comment at :151. See PS3-G12-1. Also found independently by the G25 audit (same hunk).'''
compared_with_ours = "Ours (7.0.17 0003) sized Merge from min(archsize, vfixnbr) + domnnbr and added a regression test (zero-load fixed vertices); upstream's avoids zero-load slots in Build too (nicer: fewer slots) and factors dfixmax once, but drops the domnnbr term and adds no test. Rebased as 0002: keeps upstream's structure, adds mappptr->domnnbr to the Merge bound, and the test now covers both the zero-load case and the single-fixed-vertex case (hangs on pristine 7.0.18 at `kgraph_map_rb.c:428`)."

