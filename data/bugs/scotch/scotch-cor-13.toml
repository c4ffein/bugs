[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "088a1279 (+ c778efa6)"
verdict = "incomplete"
details = '''
**Right**

swapping the rows fixes the reported example (`(10+2)*3` now kept) and c778efa6 makes stratTestSave return output errors of both operands (`parser.c:598-607`). Missing:

1. a right operand of the SAME priority needs parentheses since every binary operator is left-associative: a-(b-c) saves as `a-b-c` (different value), a%(b%c) as `a%b%c` (different value)
2. the test uses enum order as priority, but '+'/'-` share one grammar level and `%` binds tighter than `\*', so a+(b-c) saves as `a+b-c` and re-parses into another tree, and (a+b)-c saves with useless parentheses (non-idempotent save). 675/2000 random expressions still change tree on round trip. No new bug introduced.'''
compared_with_ours = "Our 7.0.17 patch (always parenthesize both operands, drop the table) was correct but discarded upstream's minimal-parentheses display; now that upstream chose the table, our rebased commit keeps upstream's table and error handling and only adds a grammar priority table (strattestsavepr) and `<=` for the right operand: 3 lines, 0/5000 mismatches. Ours is better on correctness; upstream's intent (minimal parentheses) is preserved. The `always parenthesize` variant is kept as alt A."

