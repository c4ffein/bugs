[[imported."pyscotch-7.0.17-review".fix_options]]
label = "A. Treat a null thread number like a negative one: as many threads as cores (recommended)"
summary = "common_thread.c: 'if (thrdnbr <= 0) thrdnbr = corenbr;'. SCOTCH_contextThreadImport1(): reject thrdnbr < 1 ('invalid number of threads'), since an imported pool must at least contain the master. test_scotch_context.c: one more case spawning a context with 0 threads."
diff_file = "patches/G06-threads-context/0001-Bugfix-handle-null-thread-numbers-in-thread-context-.patch"
tested = "repro/COR-10 (spawn 0, gpart with SCOTCH_PTHREAD_NUMBER=0) on both trees; new test fails on pristine (ASan OOB) and passes patched; full check matrix (4 targets x 1/2/4 threads x det 0/1 x 2 trees) rc=0."
tradeoffs = "Silent remapping of 0; a user meaning 'no extra threads' must write 1 (as documented). No documented behaviour changes (-1 still means automatic; 0 was undefined)."
preferred = true
maintainer_fit = "Exactly the interpretation of the same variable in his own src/check/test_common_thread.c:191-192 ('if (thrdnbr < 1) thrdnbr = threadSystemCoreNbr ()'); the API check on Import1 follows b10825d 'Add parameter check to SCOTCH_dgraphRedist()'."

