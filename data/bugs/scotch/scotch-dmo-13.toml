[imported."pyscotch-7.0.18-review".upstream_fix_review]
commit = "addcd163d9"
verdict = "correct"
details = '''
Allocation moved after the header write (no leak on `bad output (1)`), every intSave checked with goto fail, single memFree on both paths, 0/1 return. Still unchecked (`almost`): the four putc() separators (:106, :110, :117, :121), whose failure is caught only if a later intSave fails, and the final stdio flush: no fflush/ferror, so a write error on the last buffered block (any small ordering) returns 0 (shown with /dev/full).

Not in this routine: dorderSaveTree2 agrees on the result only under SCOTCH_DEBUG_DORDER1 (`dorder_io_tree.c:160-169`), so non-root processes return 0 while the root returns 1. The sequential writers (`order_io.c`) do not check putc either.'''
compared_with_ours = "Our 0006 guarded the two trailing writes with `if (o == 1)` and freed on both returns; upstream's goto-fail version is equivalent and also moves the allocation after the header write (better). Dropped."

