notes = "Each vertex's distance is fixed when it is first queued, at vertdist + edge load; with loads that is not the minimum (triangle a-b load 10, a-c 1, c-b 1: from a, b gets 10, not 2). Needs Dijkstra. Without edge loads every edge counts 1 and the search is exact. Effect: the deco distance matrix overstates some distances, so mappings onto it optimise against wrong costs. Found by Claude (Fable 5) reading the code; worth a property test: built distances equal shortest paths on the weighted target graph."
